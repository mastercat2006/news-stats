document.getElementById('filters').addEventListener('click', e=>{
  const el = e.target.closest('[data-cat]');
  if(el) setCat(el.dataset.cat);
});
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=esc(msg); t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2200); }
function toastUndo(msg, undo){
  const t=document.getElementById('toast');
  t.innerHTML = esc(msg) + ' <button class="undo">撤销</button>';
  t.classList.add('show'); clearTimeout(t._t);
  t.querySelector('.undo').onclick = (e) => { e.stopPropagation(); t.classList.remove('show'); undo(); };
  t._t=setTimeout(()=>t.classList.remove('show'),5200);
}

const HUES=[28,44,62,84,104,126,150,172,194,214];
function catHue(name){
  const cats = state.data ? state.data.categories.map(c=>c.name) : [];
  let i = cats.indexOf(name); if(i<0) i = name.length;
  return HUES[i % HUES.length];
}
function tagStyle(name){
  const h = catHue(name);
  return `color:hsl(${h},44%,var(--tag-l));border-color:hsl(${h},32%,var(--tag-b))`;
}
function catTag(name){ return `<span class="tag" style="${tagStyle(name)}">${esc(name)}</span>`; }
// ===== 字段配置驱动：学时/层级/拍摄/推送/完成度 =====
// 加新字段只需在 FIELDS 数组里加一项，不用再抄 open/set 两个函数
const FIELDS = [
  { key:'hours', endpoint:'hours', bodyKey:'status', btn:'hours',
    options:{pending:{label:'学时未发',cls:'pending'},issued:{label:'学时已发',cls:'issued'},none:{label:'无需学时',cls:'none'}},
    fallback:'pending', showIf:()=>true },
  { key:'scope', endpoint:'scope', bodyKey:'scope', btn:'scope',
    options:{dept:{label:'部门任务'},college:{label:'学院任务'},school:{label:'校级任务'},'':{label:'未标层级'}},
    fallback:'', showIf:()=>true },
  { key:'shot', endpoint:'shot', bodyKey:'shot', btn:'shot',
    options:{'':{label:'待定'},used:{label:'已采用'},spare:{label:'备用'},redo:{label:'需重拍'}},
    fallback:'', showIf:(it)=>it.category==='摄影'||it.category==='视频' },
  { key:'pushed', endpoint:'pushed', bodyKey:'pushed', btn:'push',
    options:{'':{label:'发送未标'},sent:{label:'已发送'},unsent:{label:'未发送'}},
    fallback:'', showIf:(it)=>['推文','海报'].includes(it.category) },
  { key:'done', endpoint:'done', bodyKey:'done', btn:'dtag',
    options:{'':{label:'完成未标',cls:'none'},done:{label:'已完成',cls:'done'},todo:{label:'未完成',cls:'todo'}},
    fallback:'', showIf:()=>true },
];
const SCOPES = {dept:'部门任务',college:'学院任务',school:'校级任务'};
const SHOTS = {'':'待定',used:'已采用',spare:'备用',redo:'需重拍'};
const PUSHES = {'':'发送未标',sent:'已发送',unsent:'未发送'};
const PUSH_CATS = ['推文','海报'];
function actStatus(a){
  const its = a.items || [];
  const pushIts = its.filter(i => PUSH_CATS.includes(i.category));
  const allSent = pushIts.length > 0 && pushIts.every(i => (pushOf(i) || '') === 'sent');
  const allDone = its.length > 0 && its.every(i => (doneOf(i) || '') === 'done');
  return allSent ? ['sent', '已发'] : (allDone ? ['done', '完成'] : ['todo', '未完成']);
}
const ACT_KINDS = ['综合推送','图文推送','简报加推送','拍摄'];
function kindOpts(cur){
  return '<option value="">未标类型</option>' + ACT_KINDS.map(k=>`<option value="${k}"${cur===k?' selected':''}>${k}</option>`).join('');
}
let fmEl = null;
function fieldDef(k){ return FIELDS.find(f=>f.key===k); }
function fieldVal(f, it){ const v = it[f.key] || f.fallback; return f.options[v] ? v : f.fallback; }
function fieldTag(f, it){
  if(f.showIf && !f.showIf(it)) return '';
  const v = fieldVal(f,it), info = f.options[v] || f.options[f.fallback];
  const cls = info.cls ? ' '+info.cls : '';
  return `<button class="${f.btn}${cls}" onclick="openFieldMenu(event,${it.id},'${f.key}','${v}')" title="点开选状态">${info.label}</button>`;
}
async function setField(id, fkey, val, prev){
  const f = fieldDef(fkey);
  const body = {}; body[f.bodyKey] = val;
  const r = await fetch('/api/items/'+id+'/'+f.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j = await r.json();
  if(!j.ok){ toast(j.error || '修改失败'); return; }
  const newVal = j[fkey] !== undefined ? j[fkey] : val;
  const info = f.options[newVal] || f.options[val] || {label:val};
  toastUndo('已标为' + info.label, async () => {
    const rb = {}; rb[f.bodyKey] = prev;
    await fetch('/api/items/'+id+'/'+f.endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rb)});
    await load();
  });
  await load();
}
function openFieldMenu(ev, id, fkey, cur){
  const f = fieldDef(fkey);
  const opts = Object.keys(f.options).map(k=>({value:k,label:f.options[k].label}));
  openFloatingMenu(ev, opts, cur, (v)=>setField(id, fkey, v, cur));
}
function hoursBtn(it){ return fieldTag(FIELDS[0], it); }
function scopeTag(it){ return fieldTag(FIELDS[1], it); }
function shotTag(it){ return fieldTag(FIELDS[2], it); }
function pushTag(it){ return fieldTag(FIELDS[3], it); }
function doneTag(it){ return fieldTag(FIELDS[4], it); }
function hoursOf(it){ return fieldVal(FIELDS[0], it); }
function scopeOf(it){ return fieldVal(FIELDS[1], it); }
function shotOf(it){ return fieldVal(FIELDS[2], it); }
function pushOf(it){ return fieldVal(FIELDS[3], it); }
function doneOf(it){ return fieldVal(FIELDS[4], it); }
// 例外：还没标完成，或者推送类还没真发出去，都是还得我动手的
function isException(it){
  if(doneOf(it) !== 'done') return true;
  if(PUSH_CATS.includes(it.category) && pushOf(it) !== 'sent') return true;
  return false;
}
function doneSelect(cur){
  const f = FIELDS[4], s = cur || '';
  return `<select id="fDone">${Object.keys(f.options).map(k =>
    `<option value="${k}" ${s===k?'selected':''}>${f.options[k].label}</option>`).join('')}</select>`;
}
function closeFloatMenu(){ if(fmEl){ fmEl.remove(); fmEl = null; } }
function openFloatingMenu(ev, opts, cur, onPick){
  ev.preventDefault(); ev.stopPropagation();
  if(fmEl){ closeFloatMenu(); return; }
  const btn = ev.currentTarget, r = btn.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'hmenu';
  el.innerHTML = opts.map(o => {
    const on = o.value === cur ? ' on' : '';
    return `<button class="hopt${on}" data-v="${esc(o.value)}">${esc(o.label)}${o.value===cur?'<span class="tick">当前</span>':''}</button>`;
  }).join('');
  el.addEventListener('click', e => {
    const b = e.target.closest('.hopt');
    if(!b) return;
    closeFloatMenu();
    onPick(b.dataset.v);
  });
  document.body.appendChild(el);
  fmEl = el;
  const w = el.offsetWidth, h = el.offsetHeight;
  let left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  el.style.left = left + 'px';
  el.style.top = top + 'px';
}
document.addEventListener('click', e => {
  if(fmEl && !e.target.closest('.hmenu') && !e.target.closest('.hours') && !e.target.closest('.scope')) closeFloatMenu();
});
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeFloatMenu(); });
window.addEventListener('scroll', () => closeFloatMenu(), true);

let booted = false;
let loadingCount = 0;
let lastRaw = null;      // 上次数据原文，用来判断有没有变
let lastUpdated = '';    // 上次的更新时间戳
async function load(){
  if(loadingCount >= 2) return;
  loadingCount++;
  try{
    let data = null;
    for(let attempt = 0; attempt < 2 && !data; attempt++){
      const ctl = new AbortController();
      const timer = setTimeout(() => ctl.abort(), 20000);
      try{
        const r = await fetch('/api/overview', {signal: ctl.signal});
        if(!r.ok) throw new Error('HTTP ' + r.status);
        data = await r.json();
      }catch(e){
        if(attempt === 1) toast('网络有点慢，没加载出来，稍后自动重试');
      }finally{
        clearTimeout(timer);
      }
    }
    if(!data) return;
    // 数据没变就只更新时间戳，不重绘，避免浏览时内容突然跳
    const raw = JSON.stringify(data);
    if(booted && raw === lastRaw){
      const u = data.meta && data.meta.updated;
      if(u && u !== lastUpdated){
        lastUpdated = u;
        const el = document.getElementById('updated');
        if(el) el.textContent = '更新于 ' + u;
      }
      return;
    }
    lastRaw = raw;
    state.data = data;
    const keys = monthBuckets(state.data).filter(k => k.key !== '__none');
    const latest = keys.length ? keys[0].key : '';
    let picked = '';
    try{ picked = localStorage.getItem('news-month-pick') || ''; }catch(e){}
    if(!booted){
      const flat = state.total || state.byProj || state.byAct;
      if(flat){
        state.month = '';
      } else if(picked && keys.some(k => k.key === state.month)){
        // 用户自己点过的月份，重开页面也停在那儿
      } else if(latest){
        state.month = latest;
        try{ localStorage.setItem('news-month', latest); }catch(e){}
      }
      const cats = new Set((state.data.categories || []).map(c => c.name));
      const special = new Set(['', '__idle', '__pending', '__shot', '__push', '__unsent', '__exc',
                               '__todo', '__done', '__s_none', '__s_dept', '__s_college', '__s_school']);
      if(state.cat && !special.has(state.cat) && !cats.has(state.cat)) state.cat = '';
    } else if(state.month && state.month !== '__none' && !keys.some(k => k.key === state.month)){
      // 页面内改完数据，选中的月份被删空了才退回最新月份
      state.month = latest;
      try{ localStorage.setItem('news-month', latest); }catch(e){}
    }
    booted = true;
    const keepY = window.scrollY;
    render();
    if(keepY) requestAnimationFrame(() => window.scrollTo(0, keepY));
    // 首次加载完触发入场动画
    requestAnimationFrame(() => {
      document.querySelectorAll('.stats,.months,.filters,.grid').forEach(el => el.classList.add('anim'));
    });
  } finally {
    loadingCount--;
  }
}

function render(){
  const d = state.data;
  const m = d.meta;
  const all = d.persons.reduce((a, p) => a.concat(p.items), []);
  const inMonth = !state.month ? all
    : all.filter(it => state.month === '__none' ? !monthKeyOf(it) : monthKeyOf(it) === state.month);

  document.getElementById('sPeople').innerHTML = m.person_count + '<span class="u">人</span>';
  document.getElementById('sCover').textContent = '已登记 ' + m.covered + ' 人 · 未登记 ' + m.idle + ' 人';
  document.getElementById('sItems').innerHTML = inMonth.length + '<span class="u">条</span>';
  document.getElementById('sAvg').textContent = state.total
    ? '全部月份 · 学时未发 ' + m.hours_pending + (m.hours_none ? ' · 无需 ' + m.hours_none : '')
    : state.month
    ? (state.month === '__none' ? '未标日期' : monthLabel(state.month)) + ' · 学时未发 ' + inMonth.filter(i=>hoursOf(i)==='pending').length
    : (m.covered ? '人均 ' + (m.total_items/m.covered).toFixed(1) + ' 条 · ' : '')
      + '学时未发 ' + m.hours_pending + (m.hours_none ? ' · 无需 ' + m.hours_none : '');
  document.getElementById('sMonthK').textContent = m.month.slice(5).replace(/^0/,'') + ' 月新增';
  document.getElementById('sMonth').innerHTML = m.month_count + '<span class="u">条</span>';
  document.getElementById('sCats').innerHTML = d.categories.length + '<span class="u">类</span>';
  const top = d.categories.slice().sort((a,b)=>b.count-a.count)[0];
  document.getElementById('sTopCat').textContent = top && top.count ? '最多 ' + top.name + ' ' + top.count + ' 条' : '—';
  document.getElementById('updated').textContent = '更新于 ' + m.updated;
  const me = m.me || {};
  document.getElementById('who').textContent = me.name
    ? '· ' + me.name + (me.role === 'viewer' ? '（只读）' : '（可编辑）') : '';

  const chipOf = (label, value, n) =>
    `<button class="chip ${state.cat===value?'active':''}${n?'':' off'}" data-cat="${esc(value)}">${label} <span class="n">${n}</span></button>`;
  let chips = chipOf('全部', '', inMonth.length);
  const catCnt = new Map();
  inMonth.forEach(it => catCnt.set(it.category, (catCnt.get(it.category) || 0) + 1));
  d.categories.forEach(c=>{
    chips += chipOf(esc(c.name), c.name, catCnt.get(c.name) || 0);
  });
  const pend = inMonth.filter(i => hoursOf(i) === 'pending').length;
  const idleCnt = d.persons.filter(p => !state.month ? p.count === 0
    : !p.items.some(it => state.month === '__none' ? !monthKeyOf(it) : monthKeyOf(it) === state.month)).length;
  chips += `<span class="chipsep"></span>`;
  chips += chipOf('待办', '__exc', inMonth.filter(isException).length);
  chips += chipOf('学时未发', '__pending', pend);
  Object.keys(SCOPES).forEach(k => {
    chips += chipOf(SCOPES[k], '__s_' + k, inMonth.filter(i => scopeOf(i) === k).length);
  });
  chips += chipOf('未标层级', '__s_none', inMonth.filter(i => !scopeOf(i)).length);
  chips += chipOf('拍摄待定', '__shot', inMonth.filter(i => (i.category==='摄影'||i.category==='视频') && !shotOf(i)).length);
  chips += chipOf('发送未标', '__push', inMonth.filter(i => PUSH_CATS.includes(i.category) && !pushOf(i)).length);
  chips += chipOf('未发送', '__unsent', inMonth.filter(i => PUSH_CATS.includes(i.category) && pushOf(i)==='unsent').length);
  chips += chipOf('未完成', '__todo', inMonth.filter(i => doneOf(i) === 'todo').length);
  chips += chipOf('已完成', '__done', inMonth.filter(i => doneOf(i) === 'done').length);
  chips += chipOf('未登记', '__idle', idleCnt);
  chips += `<input class="search" id="q" placeholder="搜人 / 搜事项 / 学号" value="${esc(state.q)}">`;
  document.getElementById('filters').innerHTML = chips;
  document.getElementById('q').addEventListener('input', e=>{ state.q = e.target.value.trim(); renderGrid(); saveView(); });

  renderMonths(all);
  renderGrid();
  saveView();
  applyRole();
}

function canEdit(){
  const me = state.data && state.data.meta && state.data.meta.me;
  return !(me && me.role === 'viewer');
}

// 只读账号：能看状态标签，但所有会写数据的入口都收起来
const MUT_ONCLICK = /openItem\(|delPerson\(|editItem\(|delItem\(|delAct\(|newAct\(|addActItem\(|saveAct\(|createAct\(|saveItem\(|updateItem\(|openMember\(|syncRoster|addPerson\(|saveMember\(|oneClickLetter|fillAllPeople|genLetter|doImport|delCat|addCat|openImport|openLetter|openLogins|downloadExport|clearExcludes/;
const PILL_ONCLICK = /openFieldMenu/;
function applyRole(){
  if(canEdit()) return;
  document.body.classList.add('viewer');
  const scan = root => {
    if(root.querySelectorAll){
      root.querySelectorAll('[onclick]').forEach(el=>{
        const code = el.getAttribute('onclick') || '';
        if(PILL_ONCLICK.test(code)){
          el.removeAttribute('onclick');
          el.style.cursor = 'default';
          el.removeAttribute('title');
        } else if(MUT_ONCLICK.test(code)){
          el.style.display = 'none';
        }
      });
    }
    document.querySelectorAll('#mask input, #mask select, #mask textarea').forEach(el=>{ el.disabled = true; });
  };
  scan(document);
  if(!window.__roleObs){
    window.__roleObs = new MutationObserver(ms=>{
      if(canEdit()) return;
      ms.forEach(m=>m.addedNodes.forEach(n=>{ if(n.nodeType === 1) scan(n); }));
    });
    window.__roleObs.observe(document.body, {childList:true, subtree:true});
  }
}

function saveView(){
  try{
    localStorage.setItem('news-view', JSON.stringify({
      total: state.total, byProj: state.byProj, byAct: state.byAct,
      month: state.month, cat: state.cat, q: state.q
    }));
  }catch(e){}
}

/* ---------- 按月份归档 ---------- */
function monthKeyOf(it){ return (it.work_date || '').slice(0, 7); }
function monthLabel(k){
  if(k === '__none') return '未标日期';
  const y = k.slice(0, 4), mm = Number(k.slice(5, 7));
  return (String(new Date().getFullYear()) === y ? '' : y.slice(2) + ' 年 ') + mm + ' 月';
}
function setMonth(k){
  state.total = false;
  state.byProj = false;
  state.byAct = false;
  state.month = k;
  try{ localStorage.setItem('news-month', k); localStorage.setItem('news-month-pick', k); }catch(e){}
  render();
}
function renderMonths(all){
  const cnt = new Map();
  all.forEach(it=>{ const k = monthKeyOf(it) || '__none'; cnt.set(k, (cnt.get(k) || 0) + 1); });
  const keys = [...cnt.keys()].sort((a, b)=>{
    if(a === '__none') return 1;
    if(b === '__none') return -1;
    return b.localeCompare(a);
  });
  let html = `<span class="lbl">归档</span>
    <button class="mchip ${state.total?'active':''}" onclick="setTotal()">总体 <span class="n">${all.length}</span></button>
    <button class="mchip ${state.byProj?'active':''}" onclick="setProj()">专题 <span class="n">${new Set([
      ...all.filter(i=>i.project).map(i=>i.project),
      ...(state.data.activities||[]).filter(a=>!(a.items||[]).length).map(a=>(a.series||a.name||'').trim())
    ].filter(Boolean)).size}</span></button>
    <button class="mchip ${state.byAct?'active':''}" onclick="setAct()">活动 <span class="n">${(state.data.activities||[]).length}</span></button>`;
  keys.forEach(k=>{
    html += `<button class="mchip ${!state.total&&!state.byProj&&state.month===k?'active':''}" onclick="setMonth('${k}')">${monthLabel(k)} <span class="n">${cnt.get(k)}</span></button>`;
  });
  document.getElementById('months').innerHTML = html;
}

function setCat(c){
  // 分类只是横向筛选，不要改变当前视图（总体/专题/活动/月份都保持）
  state.cat = c;
  render();
}
function setTotal(){ state.total = true; state.byProj = false; state.byAct = false; state.month = ''; state.cat = ''; state.q = ''; render(); }
function setProj(){ state.byProj = true; state.total = false; state.byAct = false; state.month = ''; state.cat = ''; state.q = ''; render(); }
function setAct(){ state.byAct = true; state.total = false; state.byProj = false; state.month = ''; state.cat = ''; state.q = ''; render(); }

function filterItems(items, p, key, q){
  let out = key === null ? items.slice() : items.filter(i => key === '__none' ? !monthKeyOf(i) : monthKeyOf(i) === key);
  const cat = state.cat;
  if(cat === '__pending') out = out.filter(i=>hoursOf(i)==='pending');
  else if(cat === '__shot') out = out.filter(i=>(i.category==='摄影'||i.category==='视频') && !shotOf(i));
  else if(cat === '__push') out = out.filter(i=>PUSH_CATS.includes(i.category) && !pushOf(i));
  else if(cat === '__unsent') out = out.filter(i=>PUSH_CATS.includes(i.category) && pushOf(i)==='unsent');
  else if(cat === '__todo') out = out.filter(i=>doneOf(i)==='todo');
  else if(cat === '__done') out = out.filter(i=>doneOf(i)==='done');
  else if(cat === '__exc') out = out.filter(isException);
  else if(cat === '__s_none') out = out.filter(i=>!scopeOf(i));
  else if(cat && cat.indexOf('__s_') === 0) out = out.filter(i=>scopeOf(i)===cat.slice(4));
  else if(cat) out = out.filter(i=>i.category===cat);
  if(q){
    const hitName = p.name.includes(q) || (p.student_no||'').includes(q);
    if(!hitName) out = out.filter(i=>(i.title||'').includes(q) || (i.note||'').includes(q));
  }
  return out;
}

function cardHtml(p, items, idle){
  let html = `<div class="card ${idle?'idle':''}">
    <div class="card-head">
      <span class="nm">${esc(p.name)}</span>
      ${p.role ? `<span class="role">${esc(p.role)}</span>` : ''}
      <span class="cnt">${idle?'未登记':items.length + ' 条' + ((state.cat&&state.cat!=='__idle')||state.q ? ' / 共 '+p.count : '')}</span>
      <span class="acts">
        <button class="icon-btn" title="给 ${esc(p.name)} 加一条" onclick="openItem(${p.id})">＋</button>
        <button class="icon-btn del" title="删掉这个人" onclick="delPerson(${p.id})">×</button>
      </span>
    </div>`;
  if(items.length===0){
    html += `<div class="empty">${p.student_no ? '学号 ' + esc(p.student_no) + ' · ' : ''}还没有工作记录</div>`;
  } else {
    items.forEach(it=>{
      const dt = it.work_date ? `<span class="dt">${it.work_date.slice(5).replace('-','/')}</span>` : `<span class="dt">—</span>`;
      html += `<div class="item">
        <div class="top">
          <div class="ttl">${esc(it.title)}</div>
          <div class="flags">${doneTag(it)}${hoursBtn(it)}</div>
        </div>
        <div class="meta">${dt}${catTag(it.category)}${it.p_role==='mentor'?'<span class="mtag">指导</span>':''}${scopeTag(it)}${shotTag(it)}${pushTag(it)}${it.note?`<span class="note" title="${esc(it.note)}">${esc(it.note)}</span>`:''}</div>
        <span class="acts">
          <button class="icon-btn" title="编辑" onclick='editItem(${JSON.stringify(it).replace(/'/g,"&#39;")})'>改</button>
          <button class="icon-btn del" title="删除" onclick="delItem(${it.id})">×</button>
        </span>
      </div>`;
    });
  }
  html += `</div>`;
  return html;
}

// ===== 统一写入：高度平滑 + 淡出淡入 + 错落入场 =====
// 视图切换时内容高度突变，直接换 innerHTML 会让下方整块跳；先把旧高度固定住再过渡到新高度
function prefersReduced(){
  return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}
// 换内容的同时把高度从旧值过渡到新值，避免下方元素瞬移
// 注意：任何提前 return 的分支都必须先清掉可能残留的内联高度，否则容器会被固定成旧高度、内容溢出压到下面
function smoothSwap(el, html, extraTransition){
  if(!el) return;
  const h0 = el.offsetHeight;
  el.innerHTML = html;
  const h1 = el.offsetHeight;
  el.style.height = '';
  el.style.overflow = '';
  el.style.transition = '';
  // 高度差太大（如 50 条切到 5 条）不做拉伸，否则会先留一大片空白再慢慢收，比直接换更难看
  if(prefersReduced() || !h0 || !h1 || h0 === h1 || Math.abs(h0 - h1) > 420) return;
  el.style.height = h0 + 'px';
  el.style.overflow = 'hidden';
  el.style.transition = 'height .26s var(--ease)' + (extraTransition ? ',' + extraTransition : '');
  requestAnimationFrame(()=>{ el.style.height = h1 + 'px'; });
  setTimeout(()=>{
    el.style.height = '';
    el.style.overflow = '';
    el.style.transition = '';
  }, 300);
}
function staggerIn(g){
  if(prefersReduced()) return;
  const items = [];
  Array.from(g.children).forEach(c=>{
    if(c.classList.contains('cards')) items.push(...Array.from(c.children));
    else items.push(c);
  });
  // 用 transition 逐项入场：即使过渡没跑起来，元素最终也是可见的
  // （animation 简写里带 var(--ease) 在 Chrome 里整条会解析失败，元素会卡在 opacity 0）
  items.slice(0, 24).forEach((el, i)=>{
    const delay = Math.min(i * 16, 200);
    el.style.transition = 'none';
    el.style.opacity = '0';
    el.style.transform = 'translateY(8px)';
    // 兜底：万一下面那帧没跑，也不能让内容停在不可见
    setTimeout(()=>{
      if(parseFloat(getComputedStyle(el).opacity) < 0.05){
        el.style.transition = '';
        el.style.opacity = '';
        el.style.transform = '';
      }
    }, delay + 500);
    requestAnimationFrame(()=>{
      el.style.transition = 'opacity .26s cubic-bezier(.4,0,.2,1) ' + delay + 'ms, transform .26s cubic-bezier(.4,0,.2,1) ' + delay + 'ms';
      el.style.opacity = '1';
      el.style.transform = 'translateY(0)';
      setTimeout(()=>{
        el.style.transition = '';
        el.style.opacity = '';
        el.style.transform = '';
      }, 300 + delay);
    });
  });
}
let gridTimer = null;
function setGrid(html){
  const g = document.getElementById('grid');
  if(!g) return;
  const first = !g.dataset.booted;
  if(first || prefersReduced()){
    g.innerHTML = html;
    g.dataset.booted = '1';
    if(!first) staggerIn(g);
    return;
  }
  // 先淡出（内容变透明但有旧高度撑着，下方不跳），再换内容并过渡到新高度
  g.classList.add('grid-out');
  clearTimeout(gridTimer);
  gridTimer = setTimeout(()=>{
    // 用 finally 保证淡出态一定摘掉：中途抛错也不会把内容永久留在透明
    try{
      smoothSwap(g, html, 'opacity .15s var(--ease),transform .15s var(--ease)');
      staggerIn(g);
    } finally {
      g.classList.remove('grid-out');
    }
  }, 130);
}

function renderGrid(){
  const d = state.data;
  const q = state.q;
  const roleRank = p => { const r = p.role || ''; return r.includes('负责人') ? 0 : (r.includes('组长') ? 1 : 2); };
  const byCount = (a,b)=> (roleRank(a) - roleRank(b)) || (b.count - a.count) || (a.id - b.id);

  // 未登记专用视图
  if(state.cat === '__idle' && !q){
    const idles = d.persons.filter(p=>p.count===0);
    let html = '<div class="cards">';
    idles.forEach(p=>{ html += cardHtml(p, [], true); });
    html += '</div>';
    if(!idles.length) html = `<div class="empty" style="padding:24px">全员都有记录了</div>`;
    setGrid(html);
    return;
  }

  const buckets = monthBuckets(d);
  const scope = state.month ? buckets.filter(b => b.key === state.month) : buckets;
  let html = '';
  let total = 0;

  // 专题：一件事一张表，谁指导、谁参与、每人做了什么、做到哪一步，一眼看完
  if(state.byProj){
    const groups = {};
    d.persons.forEach(p=>p.items.forEach(it=>{
      const k = (it.project || '').trim() || '未归专题';
      (groups[k] = groups[k] || []).push({ p, it });
    }));
    // 还没有任何记录的活动（如待排期的节气海报）也要在专题里占位
    if(!state.cat){
      (d.activities || []).forEach(a=>{
        if((a.items || []).length) return;
        if(q && !((a.name || '').includes(q) || (a.series || '').includes(q))) return;
        const k = (a.series || a.name || '').trim() || '未归专题';
        (groups[k] = groups[k] || []).push({ planned: a });
      });
    }
    const keys = Object.keys(groups).sort((a,b)=>{
      if(a === '未归专题') return 1;
      if(b === '未归专题') return -1;
      return groups[b].length - groups[a].length;
    });
    const statOf = it=>{
      const out = [];
      const dn = doneOf(it);
      if(dn === 'done') out.push('已完成'); else if(dn === 'todo') out.push('未完成');
      const sh = shotOf(it);
      if((it.category === '摄影' || it.category === '视频') && sh) out.push(SHOTS[sh]);
      const ps = pushOf(it);
      if(PUSH_CATS.includes(it.category) && ps) out.push(PUSHES[ps]);
      if(hoursOf(it) === 'none') out.push('学时免');
      return out.length ? out.join(' · ') : '—';
    };
    let out = '';
    keys.forEach(k=>{
      const pairs = groups[k].filter(x=>x.it && filterItems([x.it], x.p, null, q).length);
      const planned = groups[k].filter(x=>x.planned).map(x=>x.planned)
        .sort((a,b)=> (a.work_date || '').localeCompare(b.work_date || ''));
      if(!pairs.length && !planned.length) return;
      const actKinds = new Map((state.data.activities || []).map(x => [x.id, x.kind || '']));
      const kinds = [...new Set([
        ...pairs.map(x => actKinds.get(x.it.activity_id) || ''),
        ...groups[k].filter(x => x.planned).map(x => (x.planned.kind || ''))
      ].filter(Boolean))];
      const mentors = [...new Set(pairs.filter(x=>x.it.p_role === 'mentor').map(x=>x.p.name))];
      const others = [...new Set(pairs.filter(x=>x.it.p_role !== 'mentor').map(x=>x.p.name))];
      const cnt = pairs.length;
      const ppl = new Set(pairs.map(x=>x.p.id)).size;
      const cats = {};
      pairs.forEach(x=>{ cats[x.it.category] = (cats[x.it.category] || 0) + 1; });
      const catStr = Object.keys(cats).sort((a,b)=>cats[b]-cats[a]).map(c=>`${c} ${cats[c]}`).join(' · ');
      const dates = [...pairs.map(x=>x.it.work_date || ''), ...planned.map(a=>a.work_date || '')].filter(Boolean).sort();

      // 这个系列下每场活动各自算状态，做成一排小卡片，点一下直接进活动
      const seriesActs = (state.data.activities || []).filter(a => {
        if(((a.series || '').trim()) === k) return true;
        if(((a.name || '').trim()) === k) return true;
        return (a.items || []).some(it => ((it.project || '').trim() || '未归专题') === k);
      }).sort((x, y) => (y.work_date || '').localeCompare(x.work_date || ''));
      const actCards = seriesActs.map(a => {
        const cst = actStatus(a);
        const dt = a.work_date ? a.work_date.slice(5).replace('-', '/') : '待排期';
        const cnt2 = (a.items || []).length;
        const exc2 = (a.items || []).filter(isException).length;
        // 看「待办」时，没有待办的活动没必要占一张卡
        if(state.cat === '__exc' && !exc2) return '';
        return `<button class="miniact ${cst[0]}" onclick="openAct(${a.id})" title="点开这场活动"><span class="ma-d">${esc(dt)}</span><span class="act-st ${cst[0]}">${cst[1]}</span><span class="ma-n">${esc(a.name)}</span><span class="ma-num">${cnt2} 条${exc2 ? ' · ' + exc2 + ' 待办' : ''}</span></button>`;
      }).join('');
      const span = dates.length ? (dates[0] === dates[dates.length-1] ? dates[0].slice(5).replace('-','/') : dates[0].slice(5).replace('-','/') + '–' + dates[dates.length-1].slice(5).replace('-','/')) : '';
      pairs.sort((a,b)=>{
        const am = a.it.p_role === 'mentor' ? 0 : 1, bm = b.it.p_role === 'mentor' ? 0 : 1;
        return (am - bm) || (roleRank(a.p) - roleRank(b.p)) || ((b.it.work_date || '') > (a.it.work_date || '') ? -1 : 1);
      });
      // 同一个人的多条任务并在一行：名字只出现一次，任务竖排接在后面
      const byPerson = new Map();
      pairs.forEach(({p, it})=>{
        if(!byPerson.has(p.id)) byPerson.set(p.id, {p, items: []});
        byPerson.get(p.id).items.push(it);
      });
      const people = [...byPerson.values()].sort((a,b)=>{
        const am = a.items.some(i=>i.p_role === 'mentor') ? 0 : 1;
        const bm = b.items.some(i=>i.p_role === 'mentor') ? 0 : 1;
        return (am - bm) || (roleRank(a.p) - roleRank(b.p)) || (b.items.length - a.items.length);
      });
      const rows = people.map(({p, items})=>{
        items.sort((a,b)=> (a.work_date || '') < (b.work_date || '') ? 1 : -1);
        const lines = items.map(it=>{
          const date = it.work_date ? it.work_date.slice(5).replace('-','/') : '';
          const showTitle = it.p_role === 'mentor' ? it.title.replace(/^指导\s*/, '') : it.title;
          const st = statOf(it);
          return `<div class="task">
            <span class="tt2">${esc(showTitle)}</span>
            <span class="tmeta">${esc(it.category)}${date ? ' · ' + esc(date) : ''}${st !== '—' ? ' · ' + esc(st) : ''}</span>
            <span class="tacts"><button class="icon-btn" title="编辑这条" onclick='editItem(${JSON.stringify(it).replace(/'/g,"&#39;")})'>改</button><button class="icon-btn del" title="删除这条" onclick="delItem(${it.id})">×</button></span>
          </div>`;
        }).join('');
        return `<div class="prow pmerge">
          <span class="pn">${esc(p.name)}${items.some(i=>i.p_role === 'mentor') ? '<i class="mtag" style="opacity:1">指导</i>' : ''}</span>
          <div class="ptasks">${lines}</div>
        </div>`;
      }).join('');
      const plannedRows = planned.map(a=>{
        const d2 = a.work_date ? a.work_date.slice(5).replace('-','/') : '';
        return `<div class="prow pmerge">
          <span class="pn" style="color:var(--text-faint);font-weight:400">待登记</span>
          <div class="ptasks"><div class="task">
            <span class="tt2">${esc(a.name)}</span>
            <span class="tmeta">${d2 ? esc(d2) + ' · ' : ''}待排期</span>
            <span class="tacts"><button class="icon-btn" title="去登记这场活动" onclick="openAct(${a.id})">登记</button><button class="icon-btn del" title="删除这场活动" onclick="delAct(${a.id})">×</button></span>
          </div></div>
        </div>`;
      }).join('');
      out += `<div class="sec" id="sec-proj-${esc(k)}">
        <div class="sec-h"><span class="t">${esc(k)}</span><span class="sp"></span><span class="n">${cnt} 条 · ${ppl} 人${planned.length ? ' · ' + planned.length + ' 项待排期' : ''}${span ? ' · ' + span : ''}</span></div>
        ${actCards ? `<div class="miniacts">${actCards}</div>` : ''}
        <div class="projline">${kinds.length ? `<span class="tag actkind" style="opacity:1">${esc(kinds.join(' · '))}</span>` : ''}${mentors.length ? `<span class="tag mtag" style="opacity:1">指导 ${esc(mentors.join('、'))}</span>` : ''}${others.length ? `<span class="dt">参与 ${esc(others.join('、'))}</span>` : ''}${catStr ? `<span class="dt">${esc(catStr)}</span>` : ''}</div>
        <div class="ptbl">${rows}${plannedRows}</div>
      </div>`;
    });
    setGrid(out || '<div class="empty" style="padding:24px">没有匹配的记录</div>');
    return;
  }

  // 活动：一场活动一行，点开看谁参与了、各自做了什么
  if(state.byAct){
    const acts = (d.activities || []).slice();
    acts.sort((a,b)=> (b.work_date||'').localeCompare(a.work_date||'') || (b.id - a.id));
    const rows = acts.filter(a=>{
      if(state.cat === '__exc' && !(a.items || []).some(isException)) return false;
      if(!q) return true;
      return a.name.includes(q) || (a.series||'').includes(q) || (a.people||[]).some(x=>x.name.includes(q));
    });
    const now0 = new Date();
    const pad2 = n => String(n).padStart(2, '0');
    const tkey = `${now0.getFullYear()}-${pad2(now0.getMonth() + 1)}-${pad2(now0.getDate())}`;
    const wkN = '日一二三四五六'[now0.getDay()];
    // 今天这条不浮在顶上，按真实日期插进列表：上面是今天之后，下面是已经过去的
    const futureCnt = acts.filter(a => a.work_date && a.work_date > tkey).length;
    const todayCnt = acts.filter(a => a.work_date === tkey).length;
    const sepTxt = todayCnt
      ? `今天 ${todayCnt} 场${futureCnt ? ` · 之后还有 ${futureCnt} 场` : ' · 之后没有排期'}`
      : (futureCnt ? `之后还有 ${futureCnt} 场` : '之后没有排期');
    const todaySep = `<div class="todaysep"><span class="ts-k">今天</span><span class="ts-v">${cnDate()}</span><span class="ts-w">星期${wkN}</span><span class="ts-gap"></span><span class="ts-n">${sepTxt}</span></div>`;
    let h = `<div class="actbar"><span class="sec-cap">${rows.length} 场活动 · 点一行看名单</span>
      <button class="btn btn-sm" onclick="newAct()">+ 建活动</button></div>`;
    let todayPut = false;
    rows.forEach(a=>{
      if(!todayPut && a.work_date && a.work_date < tkey){ h += todaySep; todayPut = true; }
      const lv = {dept:'部门', college:'学院', school:'校级'}[a.level || ''] || '未标级别';
      const dt = a.work_date ? a.work_date.slice(5).replace('-','/') : '—';
      const n = (a.people || []).length;
      const m = (a.items || []).length;
      const st = actStatus(a);
      const excN = (a.items || []).filter(isException).length;
      // 简报是挂在活动下面的工作条目类别，单独拎出来标记：活动本身带红框「简报」，做简报的人在名字后注「（简报）」
      const briefSet = new Set((a.items || []).filter(it => it.category === '简报').map(it => it.person_name));
      const hasBrief = briefSet.size > 0;
      h += `<button class="act ${st[0]}" onclick="openAct(${a.id})">
        <div class="act-top"><span class="act-d">${dt}</span><span class="act-st ${st[0]}">${st[1]}</span><span class="act-n">${esc(a.name)}</span><span class="act-num">${n} 人 · ${m} 条${excN ? ' · ' + excN + ' 待办' : ''}</span></div>
        <div class="act-sub">${hasBrief ? '<span class="actkind brief">简报</span>' : ''}${a.kind ? `<span class="actkind">${esc(a.kind)}</span>` : ''}${esc(lv)}${a.series?' · '+esc(a.series):''} · ${n?a.people.map(x=>esc(x.name)+(x.role==='mentor'?'（指导）':'')+(briefSet.has(x.name)?'<span class="bw">（简报）</span>':'')).join('、'):'待登记'}</div>
      </button>`;
    });
    if(!todayPut) h += todaySep;
    setGrid(rows.length ? h : '<div class="empty" style="padding:24px">还没有活动，点右上角「+ 建活动」</div>');
    return;
  }

  // 总体：所有人 × 全部月份，一张卡装下这个人所有记录，不再按月切段
  if(state.total){
    const ps = d.persons.slice().sort(byCount);
    const inner = [];
    let cnt = 0;
    ps.forEach(p=>{
      let items = filterItems(p.items, p, null, q);
      items = items.slice().sort((a,b)=> (b.work_date||'').localeCompare(a.work_date||'') || (b.id - a.id));
      if(!items.length && (state.cat || q) && !(q && p.name.includes(q))) return;
      inner.push(cardHtml(p, items, !items.length));
      cnt += items.length;
    });
    let h = `<div class="sec" id="sec-total">
      <div class="sec-h"><span class="t">总体</span><span class="sp"></span><span class="n">${cnt} 条 · ${inner.length} 人 · 全部月份</span></div>
      <div class="cards">${inner.join('')}</div></div>`;
    setGrid(h || '<div class="empty">没有记录</div>');
    return;
  }

  scope.forEach(b=>{
    const inner = [];
    let cnt = 0;
    d.persons.filter(p=>p.count > 0).sort(byCount).forEach(p=>{
      const items = filterItems(p.items, p, b.key, q);
      if(!items.length) return;
      inner.push(cardHtml(p, items, false));
      cnt += items.length;
    });
    if(!inner.length) return;
    total += cnt;
    html += `<div class="sec" id="sec-${esc(b.key)}">
      <div class="sec-h"><span class="t">${b.label}</span><span class="sp"></span><span class="n">${cnt} 条 · ${inner.length} 人</span></div>
      <div class="cards">${inner.join('')}</div>
    </div>`;
  });

  // 搜人时，没记录的人也给一张卡
  if(q){
    const idles = d.persons.filter(p=>p.count===0 && (p.name.includes(q) || (p.student_no||'').includes(q)));
    if(idles.length){
      html += `<div class="sec"><div class="sec-h"><span class="t">还没有记录</span><span class="sp"></span><span class="n">${idles.length} 人</span></div>
        <div class="cards">${idles.map(p=>cardHtml(p, [], true)).join('')}</div></div>`;
    }
  } else if(state.cat === '' && !state.month){
    const idle = d.persons.filter(p=>p.count===0);
    if(idle.length){
      if(state.idle){
        html += `<div class="sec"><div class="sec-h"><span class="t">还没有记录</span><span class="sp"></span><span class="n">${idle.length} 人</span></div>
          <div class="cards">${idle.map(p=>cardHtml(p, [], true)).join('')}</div></div>`;
      } else {
        html += `<div class="idlebar">
          <span>未登记 <b>${idle.length}</b> 人</span>
          <span class="names">${idle.map(p=>esc(p.name)).join('、')}</span>
          <button class="btn btn-ghost btn-sm sp" onclick="state.idle=true;renderGrid()">展开</button>
        </div>`;
      }
    }
  }
  if(!total && !html) html = `<div class="empty" style="padding:24px">没有匹配的记录</div>`;
  setGrid(html);
}

function monthBuckets(d){
  const keys = new Set();
  d.persons.forEach(p=>p.items.forEach(it=> keys.add(monthKeyOf(it) || '__none')));
  return [...keys].sort((a,b)=>{
    if(a === '__none') return 1;
    if(b === '__none') return -1;
    return b.localeCompare(a);
  }).map(k => ({ key: k, label: monthLabel(k) }));
}

/* ---------- 弹窗 ---------- */
function esc2(s){ return esc(s == null ? '' : String(s)); }

function actNameOf(aid){
  const a = (state.data.activities || []).find(x => x.id === aid);
  return a ? a.name : '';
}

function openAct(id){
  const a = (state.data.activities || []).find(x => x.id === id);
  if(!a) return;
  window.curActId = id;
  const lvOpts = [['', '未标级别'], ['dept', '部门任务'], ['college', '学院任务'], ['school', '校级任务']]
    .map(([v, t]) => `<option value="${v}" ${(a.level || '') === v ? 'selected' : ''}>${t}</option>`).join('');
  const doneOpts = v => [['', '未标'], ['done', '已完成'], ['todo', '未完成']]
    .map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('');
  const pushOpts = v => [['', '未标'], ['sent', '已发送'], ['unsent', '未发送']]
    .map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('');
  const shotOpts = v => [['', '待定'], ['used', '已采用'], ['spare', '备用'], ['redo', '需重拍']]
    .map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('');
  const hoursOpts = v => [['pending', '未发'], ['issued', '已发'], ['none', '无需']]
    .map(([k, t]) => `<option value="${k}" ${k === v ? 'selected' : ''}>${t}</option>`).join('');
  const hasShot = (a.items || []).some(i => i.category === '摄影' || i.category === '视频');
  const hasPush = (a.items || []).some(i => PUSH_CATS.includes(i.category));
  const rows = (a.people || []).map(p=>{
    const items = (a.items || []).filter(i => i.person_id === p.id);
    return items.map(it=>{
      const canPush = PUSH_CATS.includes(it.category);
      const canShot = it.category === '摄影' || it.category === '视频';
      return `<tr data-iid="${it.id}"><td>${esc2(p.name)}${p.role === 'mentor' ? '<br><span class="mtag" style="opacity:1">指导</span>' : ''}</td>

let behindTimer = null;
function syncRowSelect(itemId, field, val){
  const tr = document.querySelector('tr[data-iid="' + itemId + '"]');
  const sel = tr ? tr.querySelector('select[data-f="' + field + '"]') : null;
  if(sel) sel.value = val;
}
// 弹窗不动，只把背后的统计、筛选计数、活动状态标签重画
function refreshBehind(delay){
  clearTimeout(behindTimer);
  behindTimer = setTimeout(() => { window.actDirty = false; load(); }, delay || 200);
}

async function setActState(itemId, field, val){
  const r = await fetch('/api/items/' + itemId + '/' + field, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({[field]: val})
  });
  if(!r.ok){
    // 状态机拦下的时候把原因说清楚，别一律报「保存失败」
    let msg = '保存失败';
    try{ const j = await r.json(); if(j && j.error) msg = j.error; }catch(e){}
    toast(msg);
    const tr = document.querySelector('tr[data-iid="' + itemId + '"]');
    const sel = tr ? tr.querySelector('select[data-f="' + field + '"]') : null;
    const it = ((state.data.activities || []).find(a => (a.items || []).some(i => i.id === itemId)) || {items: []}).items.find(i => i.id === itemId);
    if(sel && it) sel.value = it[field] || '';
    return;
  }
  // 就地更新内存里的这条记录，不重建弹窗——否则正在改的活动名/日期会被冲掉
  window.actDirty = true;
  (state.data.activities || []).forEach(a => (a.items || []).forEach(i => {
    if(i.id === itemId){
      i[field] = val;
      // 发送即完成：把该行的完成情况下拉也同步翻过去
      if(field === 'pushed' && val === 'sent') i.done = 'done';
    }
  }));
  if(field === 'pushed' && val === 'sent') syncRowSelect(itemId, 'done', 'done');
  refreshBehind();
}

// 拍摄、剪辑、简报这类没有发送环节，只需要标完成；推送类仍走「一键发送」
async function doneAllAct(aid){
  const a = (state.data.activities || []).find(x => x.id === aid);
  if(!a) return;
  const items = (a.items || []);
  const toDone = items.filter(i => (i.done || '') !== 'done');
  if(!toDone.length){ toast('这场活动的条目都已标完成'); return; }
  const unsent = toDone.filter(i => PUSH_CATS.includes(i.category) && (i.pushed || '') !== 'sent').length;
  if(!confirm('把这场活动的 ' + toDone.length + ' 条记录标为已完成？' + (unsent ? '\n其中 ' + unsent + ' 条推送仍记为未发送，发送状态不变。' : ''))) return;
  let ok = 0;
  for(const it of toDone){
    const r = await fetch('/api/items/' + it.id + '/done', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({done:'done'})});
    if(r.ok){ it.done = 'done'; ok++; syncRowSelect(it.id, 'done', 'done'); }
  }
  toast('已完成 ' + ok + '/' + toDone.length + ' 条');
  refreshBehind();
}

async function pushAllAct(aid){
  const a = (state.data.activities || []).find(x => x.id === aid);
  if(!a) return;
  const items = (a.items || []);
  const toPush = items.filter(i => PUSH_CATS.includes(i.category) && (i.pushed || '') !== 'sent');
  const toDone = items.filter(i => (i.done || '') !== 'done');
  if(!toPush.length && !toDone.length){ toast('这场活动已经全部发送、全部完成'); return; }
  const msgs = [];
  if(toPush.length) msgs.push('把 ' + toPush.length + ' 条推文/海报标为已发送');
  if(toDone.length) msgs.push('把 ' + toDone.length + ' 条记录标为已完成');
  if(!confirm('这场活动：' + msgs.join('，') + '？')) return;
  let pushOk = 0, doneOk = 0;
  for(const it of toPush){
    const r = await fetch('/api/items/' + it.id + '/pushed', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({pushed:'sent'})});
    if(r.ok){ it.pushed = 'sent'; pushOk++; syncRowSelect(it.id, 'pushed', 'sent'); }
  }
  for(const it of toDone){
    const r = await fetch('/api/items/' + it.id + '/done', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({done:'done'})});
    if(r.ok){ it.done = 'done'; doneOk++; syncRowSelect(it.id, 'done', 'done'); }
  }
  toast('已发送 ' + pushOk + '/' + toPush.length + ' 条，已完成 ' + doneOk + '/' + toDone.length + ' 条');
  refreshBehind();
}

async function setActHours(itemId, val){
  const r = await fetch('/api/items/' + itemId + '/hours', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status: val})
  });
  if(!r.ok){ toast('保存失败'); return; }
  window.actDirty = true;
  (state.data.activities || []).forEach(a => (a.items || []).forEach(i => { if(i.id === itemId) i.hours = val; }));
  refreshBehind();
}

async function delActItem(itemId, btn){
  if(!confirm('删除这条记录？')) return;
  const r = await fetch('/api/items/' + itemId, {method: 'DELETE'});
  if(!r.ok){ toast('删除失败'); return; }
  window.actDirty = true;
  // 只删这一行，不重建弹窗：活动名/日期等未保存的输入保留
  (state.data.activities || []).forEach(a => { a.items = (a.items || []).filter(i => i.id !== itemId); });
  (state.data.persons || []).forEach(p => { p.items = (p.items || []).filter(i => i.id !== itemId); });
  const tr = btn && btn.closest('tr');
  if(tr) tr.remove();
  toast('已删除');
  refreshBehind();
}

function openModal(html,wide){
  const m = document.getElementById('modal');
  m.innerHTML = html;
  m.classList.toggle('wide', !!wide);
  // 元素是复用的，不改写 animation 不会重放进场效果
  m.style.animation = 'none';
  void m.offsetWidth;
  m.style.animation = '';
  document.getElementById('mask').classList.add('show');
  document.body.classList.add('modal-open');
}
function closeModal(){
  document.getElementById('mask').classList.remove('show');
  document.body.classList.remove('modal-open');
  if(typeof revokeLetter === 'function') revokeLetter();
  if(window.actDirty){
    window.actDirty = false;
    clearTimeout(behindTimer);
    load();
  }
}

function bindNewSelects(){
  const fp = document.getElementById('fPerson');
  const fn = document.getElementById('fPersonNew');
  fp.addEventListener('change', ()=>{ fn.style.display = fp.value==='__new' ? 'block':'none'; if(fp.value==='__new') fn.focus(); });
  const fc = document.getElementById('fCat');
  const cn = document.getElementById('fCatNew');
  const fs = document.getElementById('fShotWrap');
  const fpu = document.getElementById('fPushWrap');
  const updShot = ()=>{
    if(fs) fs.style.display = (fc.value==='摄影'||fc.value==='视频') ? 'block':'none';
    if(fpu) fpu.style.display = PUSH_CATS.includes(fc.value) ? 'block':'none';
  };
  fc.addEventListener('change', ()=>{ cn.style.display = fc.value==='__new' ? 'block':'none'; if(fc.value==='__new') cn.focus(); updShot(); });
  updShot();
  const ft = document.getElementById('fTitle');
  ft.addEventListener('input', ()=>{
    const m = ft.value.match(/(\d{1,2})\s*月\s*(\d{1,2})\s*[日号]/);
    const fd = document.getElementById('fDate');
    if(m && !fd.value){
      const y = new Date().getFullYear();
      fd.value = `${y}-${String(m[1]).padStart(2,'0')}-${String(m[2]).padStart(2,'0')}`;
    }
  });
}

function scopeOptions(){
  const st = {};
  state.data.persons.forEach(p=>p.items.forEach(it=>{
    const k = (it.work_date || '').slice(0,7) || 'none';
    if(!st[k]) st[k] = { items: 0, persons: new Set() };

  }));

    opts.push(`<option value="${k}" ${k === cur ? 'selected' : ''}>${esc(label)}（${st[k].persons.size} 人 / ${st[k].items} 条）</option>`);

const BRIEF_EDIT_RE = /修改|改稿|校对|编辑|审稿|润色/;
const BRIEF_WRITE_RE = /撰写|编写|起草|撰稿/;
function isBriefEdit(it){
  const txt = (it.title || '') + ' ' + (it.note || '');
  return BRIEF_EDIT_RE.test(txt) && !BRIEF_WRITE_RE.test(txt);
}
function activityHasSent(aid){
  const a = (state.data.activities || []).find(x => x.id === aid);
  return !!(a && (a.items || []).some(x => (x.category || '') === '推文' && (x.pushed || '') === 'sent'));
}
function noHours(it){
  const cat = it.category || '';
  const hours = it.hours || 'pending';
  if(hours !== 'pending' && !(cat === '简报' && hours === 'none')) return true; // 已发 / 无需
  if((it.p_role || '') === 'mentor') return true;                                  // 指导
  if(cat === '推文' && (it.pushed || '') !== 'sent') return true;                  // 推文未发送
  if(cat === '主次图' && !activityHasSent(it.activity_id)) return true;            // 所属推文未发送
  if(cat === '海报' && (it.pushed || '') !== 'sent') return true;                  // 海报未发送
  if(cat === '摄影'){
    const txt = (actNameOf(it.activity_id) || it.project || '') + ' ' + (it.title || '');
    if(txt.indexOf('班会') >= 0) return true;                                       // 班会拍照不计
  }
  if(cat === '简报' && isBriefEdit(it)) return true;                               // 改稿/校对/编辑不计
  return false;
}
function monthStats(){
  const st = {};
  (state.data.persons || []).forEach(p => (p.items || []).forEach(it => {
    const k = (it.work_date || '').slice(0,7);
    if(!k) return;
    if(!st[k]) st[k] = { items: 0, persons: new Set() };
    st[k].items++; st[k].persons.add(p.id);
  }));
  return st;
}
function monthOptions(kind, selected){
  const st = monthStats();
  const d = new Date();
  const cur = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const sel = selected || cur;
  const keys = Object.keys(st).sort().reverse();
  let opts = '';
  if(kind === 'from'){
    opts += `<option value="all" ${sel === 'all' ? 'selected' : ''}>全部月份</option>`;
  }
  keys.forEach(k => {
    const label = k.replace('-','年') + '月';
    opts += `<option value="${k}" ${k === sel ? 'selected' : ''}>${esc(label)} · ${st[k].persons.size}人</option>`;
  });
  return opts;
}
function excludeOptions(prefix){
  return (state.data.persons || []).map(p =>
    `<label><input type="checkbox" class="${prefix}" value="${p.id}"><span>${esc(p.name)}</span></label>`).join('');
}
function getExcluded(prefix){
  return [...document.querySelectorAll('input.' + prefix + ':checked')].map(x => Number(x.value)).filter(Boolean);
}
function clearExcludes(prefix){
  document.querySelectorAll('input.' + prefix + ':checked').forEach(x => { x.checked = false; });
}
function inMonthScope(it, from, to){
  if(from === 'all') return true;
  const k = (it.work_date || '').slice(0,7);
  if(!k) return false;
  if(from && k < from) return false;
  if(to && k > to) return false;
  return true;
}
function summaryPersons(from, to, excludeIds){
  const ex = excluded => excludeIds.includes(Number(excluded));
  return (state.data.persons || []).filter(p => !ex(p.id) && (p.items || []).some(it =>
    !noHours(it) && inMonthScope(it, from, to)));
}
function rangeLabel(from, to){
  if(from === 'all') return '';
  const fmt = k => k.slice(0,4) + '年' + Number(k.slice(5)) + '月';
  return from === to ? fmt(from) : fmt(from) + '—' + fmt(to);
}
function scopePersons(scope){
  return (state.data.persons || []).filter(p => (p.items || []).some(it =>
    !noHours(it) && (scope === 'all' || ((it.work_date || '').slice(0,7) || 'none') === scope)));
}

      <div class="field"><label>名单：一行一个人，写「姓名 学号 班级 学时 备注」，顺序随意，可只写姓名</label>
        <textarea id="lPeople" style="min-height:130px" placeholder="张心语 20251101217 生科25-2 2"></textarea>
        <div class="hint"><button class="lnk" onclick="fillAllPeople()">带入全部成员</button>　按统计里的成员名单铺 ${state.data.persons.length} 行。</div>
      </div>
      <div class="field"><label>正文（留空自动拼，按月汇总时自动写成汇总口气）</label>
        <textarea id="lBody" style="min-height:86px" placeholder="留空即可"></textarea>
      </div>
      <div class="row2">
        <div class="field"><label>落款单位</label><input id="lSigner" value="${esc(prof.lSigner)}"></div>
        <div class="field"><label>落款日期</label><input id="lDate" value="${cnDate()}"></div>
      </div>
      <div class="field"><label>标题（留空按活动名自动生成）</label><input id="lTitle" placeholder="关于「活动名称」获得第二课堂学时认证的函"></div>
      <div class="actions"><button class="btn" id="lGen" onclick="genLetter()">按上面设置生成</button></div>
    </details>`, true);
}
async function oneClickLetter(){
  const err = document.getElementById('fErr');
  err.textContent = '';
  const from = document.getElementById('lFrom').value;
  const to = document.getElementById('lTo').value;
  if(from !== 'all' && to && from > to){ err.textContent = '起始月份不能晚于结束月份'; return; }
  const excludeIds = getExcluded('lEx');
  const people = summaryPersons(from, to, excludeIds);
  if(!people.length){ err.textContent = '这个月份区间/排除条件下没有人'; return; }
  const actEl = document.getElementById('lActivity');
  const whenEl = document.getElementById('lWhen');
  let summary = false;
  if(!actEl.value.trim()){
    summary = true;
    const label = rangeLabel(from, to);
    actEl.value = label ? label + '新闻部工作学时汇总' : '新闻部新闻宣传工作学时汇总';
    if(!whenEl.value.trim() && label) whenEl.value = label;
  }
  window.letterSummary = summary;
  document.getElementById('lPeople').value =
    people.map(p => [p.name, p.student_no || '', p.cls || ''].join(' ').trim()).join('\n');
  // 按月汇总时，附件里每个人那一行的「活动名称」写他实际参与的活动，而不是笼统的汇总名
  if(summary){
    window.letterActs = {};
    people.forEach(p => {
      const its = (p.items || []).filter(it => !noHours(it) && inMonthScope(it, from, to));
      const set = [...new Set(its.map(it => actNameOf(it.activity_id) || it.project || '').filter(Boolean))];
      if(set.length) window.letterActs[p.name] = set.join('、');
    });
  } else {
    window.letterActs = null;
  }
  if(summary){
    const prof = letterProfile();
    const label = rangeLabel(from, to);
    document.getElementById('lBody').value = summaryBody(actEl.value, whenEl.value.trim(), people.length, people[0].name, prof.lSigner);
  }
  await genLetter();
}
function fillAllPeople(){
  const ta = document.getElementById('lPeople');
  ta.value = state.data.persons.map(p => [p.name, p.student_no || '', p.cls || ''].join(' ').trim()).join('\n');
}
async function genLetter(){
  const err = document.getElementById('fErr');
  err.textContent = '';
  const activity = document.getElementById('lActivity').value.trim();
  if(!activity){ err.textContent = '先填活动名称，或点「一键生成」让它按月自动命名'; return; }
  if(!document.getElementById('lPeople').value.trim()){ err.textContent = '名单是空的，点「一键生成」或先带入成员'; return; }
  const payload = {
    activity,
    title: document.getElementById('lTitle').value.trim(),
    body: (document.getElementById('lBody') || {value:''}).value.trim(),
    when: document.getElementById('lWhen').value.trim(),
    place: document.getElementById('lPlace').value.trim(),
    host: document.getElementById('lHost').value.trim(),
    purpose: document.getElementById('lPurpose').value.trim(),
    content: document.getElementById('lContent').value.trim(),
    level: document.getElementById('lLevel').value,
    category: document.getElementById('lCat').value,
    hours: document.getElementById('lHours').value.trim(),
    default_class: document.getElementById('lClass').value.trim(),
    teacher: document.getElementById('lTeacher').value.trim(),
    signer: document.getElementById('lSigner').value.trim(),
    sign_date: document.getElementById('lDate').value.trim(),
    people_text: document.getElementById('lPeople').value,
    person_activities: window.letterActs || null,
    summary: !!window.letterSummary,
    scope: (function(){
      const f = document.getElementById('lFrom'), t = document.getElementById('lTo');
      if(!f) return 'all';
      return f.value === 'all' ? 'all' : (f.value === (t ? t.value : f.value) ? f.value : 'range');
    })(),
    scope_from: (function(){
      const f = document.getElementById('lFrom');
      return f && f.value !== 'all' ? f.value : '';
    })(),
    scope_to: (function(){
      const f = document.getElementById('lFrom'), t = document.getElementById('lTo');
      return f && f.value !== 'all' && t ? t.value : '';
    })(),
    exclude_person_ids: getExcluded('lEx'),
  };
  const btns = ['lGenOne','lGen'].map(id => document.getElementById(id)).filter(Boolean);
  const labels = btns.map(b => b.innerHTML);
  btns.forEach(b => { b.disabled = true; b.setAttribute('aria-busy','true'); b.innerHTML = '<span class="spin"></span>生成中…'; });
  try{
    const r = await fetch('/api/hours-letter',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    if(!r.ok){
      let msg = '生成失败';
      try{ const j = await r.json(); msg = j.error || msg; }catch(e){}
      err.textContent = msg; return;
    }
    const blob = await r.blob();
    const cd = r.headers.get('Content-Disposition') || '';
    let name = '学时函.docx';
    const m = cd.match(/filename\*=UTF-8''([^;]+)/);
    if(m) name = decodeURIComponent(m[1]);
    const url = URL.createObjectURL(blob);
    letterUrl = url;
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    const done = document.getElementById('lDone');
    done.innerHTML = `已生成：${esc(name)}<br><a class="lnk" href="${url}" download="${esc(name)}">没弹出下载？点这里存下来</a>`;
    done.style.display = 'block';
    saveLetterProfile();
    toast('学时函已生成');
  }finally{
    btns.forEach((b, i) => { b.disabled = false; b.removeAttribute('aria-busy'); b.innerHTML = labels[i]; });
  }
}
let letterUrl = null;
function revokeLetter(){
  if(letterUrl){ URL.revokeObjectURL(letterUrl); letterUrl = null; }
}
function openImport(){
  openModal(`
    <h2>批量贴入</h2>
    <div class="field">
      <label>按「姓名 + · 事项」的格式粘进来</label>
      <textarea id="impText" placeholder="李雨菲
· 星途致远保研交流第一期推文
· 10月14日 班会拍照

朱雅琪
· 立冬海报"></textarea>
      <div class="hint">名字单独一行，事项以 · 或 - 开头；空行分段。日期、分类会自动识别，粘完还能逐条改。</div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="doImport()">导入</button>
    </div>`);
}
async function doImport(){
  const text = document.getElementById('impText').value;
  if(!text.trim()){ document.getElementById('fErr').textContent='先贴点内容'; return; }
  const r = await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
  const j = await r.json();
  if(!j.ok){ document.getElementById('fErr').textContent = j.error || '导入失败'; return; }
  closeModal(); toast(`导入 ${j.added} 条`); await load();
}

/* ---------- 分类管理 ---------- */
function openCats(){
  const cs = state.data.categories;
  const rows = cs.map(c=>`<div class="catrow">
      <span class="tag" style="${tagStyle(c.name)}">${esc(c.name)}</span>
      <span class="mono">${c.count} 条</span>
      ${c.count ? `<span class="mono dim">有记录，不能删</span>` :
        `<button class="icon-btn del" title="删掉这个分类" onclick="delCat(${c.id})">×</button>`}
    </div>`).join('');
  openModal(`
    <h2>分类管理</h2>
    <div class="catlist">${rows || '<div class="empty">还没有分类</div>'}</div>
    <div class="field" style="margin-top:14px">
      <label>加一个分类</label>
      <input id="newCatName" placeholder="比如 排版 / 直播 / 值班">
      <div class="hint">分类下面还有记录时不能删，先把那些记录改到别的分类再删。</div>
    </div>
    <div class="err" id="fErr"></div>
    <div class="actions">
      <button class="btn btn-ghost" onclick="closeModal()">关掉</button>
      <button class="btn btn-primary" onclick="addCat()">添加</button>
    </div>`);
}
async function addCat(){
  const name = document.getElementById('newCatName').value.trim();
  const err = document.getElementById('fErr');
  if(!name){ err.textContent = '写个名字'; return; }
  const r = await fetch('/api/categories',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})});
  const j = await r.json();
  if(!j.ok){ err.textContent = j.error || '添加失败'; return; }
  toast('已加分类：' + name); await load(); openCats();
}
async function delCat(id){
  const c = state.data.categories.find(x=>x.id===id);
  const name = c ? c.name : '';
  if(!confirm('删掉分类「'+name+'」？')) return;
  const r = await fetch('/api/categories/'+id,{method:'DELETE'});
  const j = await r.json();
  if(!j.ok){ toast(j.error || '删除失败'); return; }
  toast('已删分类：' + name); await load(); openCats();
}

/* ---------- 导出 ---------- */
function toggleExport(){
  const d = new Date();
  const cur = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  const defFrom = state.month && state.month !== '__none' ? state.month : 'all';
  const defTo = state.month && state.month !== '__none' ? state.month : cur;
  const scope = state.month ? '当前只看 ' + (state.month === '__none' ? '未标日期' : monthLabel(state.month)) + '，导出默认沿用这个范围。' : '';
  openModal(`
    <h2>导出</h2>
    <p style="font-size:12.5px;color:var(--text-dim);line-height:1.7">三种格式都按人分组，直接下载。${esc(scope)}</p>
    <div class="row2">
      <div class="field" style="margin-bottom:0"><label>起始月份</label><select id="eFrom">${monthOptions('from', defFrom)}</select></div>
      <div class="field" style="margin-bottom:0"><label>结束月份</label><select id="eTo">${monthOptions('to', defTo)}</select></div>
    </div>
    <div class="field"><label>排除人员（可多选，不导出）</label>
      <div class="exclude-grid" id="eExclude">${excludeOptions('eEx')}</div>
      <div class="hint"><button class="lnk" onclick="clearExcludes('eEx')">清空排除</button></div>
    </div>
    <div class="actions" style="justify-content:flex-start;flex-wrap:wrap">
      <button class="btn btn-ghost" onclick="downloadExport('md',this)">Markdown</button>
      <button class="btn btn-ghost" onclick="downloadExport('csv',this)">CSV（Excel）</button>
      <button class="btn btn-ghost" onclick="downloadExport('json',this)">JSON</button>
      <button class="btn btn-ghost" onclick="closeModal()">关掉</button>
    </div>
    <div class="err" id="eErr"></div>`);
}
async function downloadExport(fmt, btn){
  const err = document.getElementById('eErr');
  if(err) err.textContent = '';
  const from = document.getElementById('eFrom').value;
  const to = document.getElementById('eTo').value;
  if(from !== 'all' && to && from > to){ if(err) err.textContent = '起始月份不能晚于结束月份'; return; }
  const params = new URLSearchParams({format: fmt});
  if(from !== 'all'){ params.set('from', from); params.set('to', to); }
  const exclude = getExcluded('eEx');
  if(exclude.length) params.set('exclude', exclude.join(','));
  const old = btn.innerHTML;
  btn.disabled = true; btn.setAttribute('aria-busy','true'); btn.innerHTML = '<span class="spin"></span>导出中…';
  try{
    const r = await fetch('/api/export?' + params.toString());
    if(!r.ok) throw new Error('导出失败');
    const blob = await r.blob();
    let name = 'news-stats.' + fmt;
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename\*=UTF-8''([^;]+)/);
    if(m) name = decodeURIComponent(m[1]);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }catch(e){
    if(err) err.textContent = e.message || '导出失败';
  }finally{
    btn.disabled = false; btn.removeAttribute('aria-busy'); btn.innerHTML = old;
  }
}
