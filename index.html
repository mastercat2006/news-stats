<!DOCTYPE html>
<html lang="zh-CN" data-ink-site>
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>新闻部工作统计 · 公网版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='2' fill='%23191702'/%3E%3Ctext x='50' y='70' font-size='52' font-family='serif' font-weight='bold' fill='%23FDFDF3' text-anchor='middle'%3E稿%3C/text%3E%3C/svg%3E">
<style>
:root{
  --ease:cubic-bezier(.4,0,.2,1);
  --bg:#F2F1E7; --card:#FDFDF3; --border:#DEDCCB;
  --text:#2E2925; --text-dim:#423C33; --text-faint:#7E7A6B;
  --head-bg:#F7F6EC; --hover:#EDECE0; --hl:#F6F1DC;
  --accent:#191702; --accent-text:#FDFDF3; --line-strong:#494848;
  --danger:#A9553F;
  --tag-l:34%; --tag-b:72%; --tag-o:.9;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --serif:"Spectral","Songti SC","STSong","Noto Serif SC",serif;
  --mono:"SF Mono","JetBrains Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0D0C0A; --card:#171613; --border:#2E2C28;
    --text:#E9E6DA; --text-dim:#CDC9BA; --text-faint:#A19C8D;
    --head-bg:#1A1916; --hover:#201F1A; --hl:#2A2619;
    --accent:#C2BDAD; --accent-text:#0D0C0A; --line-strong:#4A473F;
    --danger:#C9765B;
    --tag-l:72%; --tag-b:46%; --tag-o:.92;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
/* 滚动条槽位常驻：筛选后内容变短、滚动条消失时不会因为可用宽度变化而整页左右位移 */
html{scrollbar-gutter:stable}
body{
  background:var(--bg); color:var(--text); padding:14px;
  font-family:var(--sans); font-size:13.5px; line-height:1.7;
  letter-spacing:.012em; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .3s var(--ease),color .3s var(--ease);
}
@media(max-width:640px){body{padding:10px}}
.wrap{max-width:1100px;margin:0 auto;animation:pageIn .25s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.stats,.months,.filters,.grid{opacity:0}
.stats.anim{animation:riseIn .22s var(--ease) 0ms both}
.months.anim{animation:riseIn .22s var(--ease) 60ms both}
.filters.anim{animation:riseIn .22s var(--ease) 120ms both}
.grid.anim{animation:riseIn .22s var(--ease) 180ms both}
::selection{background:var(--hl)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:5px}

.topbar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  background:var(--card);border:1px solid var(--border);border-radius:2px;
  padding:12px 16px;margin-bottom:12px;
}
.topbar h1{font-family:var(--serif);font-size:20px;font-weight:600;letter-spacing:.09em;line-height:1.4}
.topbar .sub{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.tb-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{
  border:1px solid transparent;border-radius:4px;padding:7px 14px;font-size:12.5px;font-weight:500;
  cursor:pointer;background:transparent;color:var(--text-dim);font-family:inherit;
  transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .2s var(--ease);
}
.btn:hover{background:var(--hover);color:var(--text);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.btn-primary:hover{background:var(--accent);color:var(--accent-text);box-shadow:0 4px 14px rgba(0,0,0,.16)}
.btn-ghost{border-color:var(--border)}
.btn-sm{padding:4px 10px;font-size:11.5px}
  .btn[aria-busy="true"]{opacity:.62;pointer-events:none}
  .spin{display:inline-block;width:10px;height:10px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;margin-right:5px;vertical-align:-1px;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .exclude-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px 10px;max-height:132px;overflow-y:auto;overflow-x:hidden;border:1px solid var(--border);border-radius:4px;padding:8px 10px}
  .exclude-grid label{display:flex;align-items:center;gap:5px;min-width:0;font-size:12px;color:var(--text-dim)}
  .exclude-grid label span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media(max-width:520px){.exclude-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn-danger{color:var(--danger);border-color:var(--danger)}

.stats{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  background:var(--card);border:1px solid var(--border);border-radius:2px;
  padding:12px 16px;margin-bottom:12px;
}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{padding:2px 4px}
.stat .k{font-family:var(--sans);font-size:10.5px;color:var(--text-faint);letter-spacing:.1em;text-transform:uppercase;font-weight:500}
.stat .v{font-family:var(--sans);font-size:23px;font-weight:600;line-height:1.35;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.stat .u{font-size:11px;color:var(--text-faint);margin-left:3px;font-weight:400;letter-spacing:0}
.stat .d{font-size:10.5px;color:var(--text-faint);margin-top:3px;letter-spacing:.02em;font-variant-numeric:tabular-nums}

.filters{
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:2px;
  padding:10px 14px;margin-bottom:12px;
}
.chipsep{width:1px;height:14px;background:var(--border);margin:0 3px;flex:0 0 auto}
.chip{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 11px;border-radius:4px;border:1px solid var(--border);
  font-size:12px;color:var(--text-dim);background:transparent;cursor:pointer;
  transition:background .18s var(--ease),color .18s var(--ease),border-color .18s var(--ease);
}
.chip:hover{background:var(--hover);color:var(--text)}
.chip.active{background:var(--hover);color:var(--text);border-color:var(--line-strong);box-shadow:inset 0 -2px 0 var(--accent)}
.chip .n{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
/* 计数为 0 的筛选项仍然占位、只是变灰不可点，避免集合变化导致整条左右重排 */
.chip.off{opacity:.36;pointer-events:none}
.months{
  display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:8px;
}
.months .lbl{font-size:11.5px;color:var(--text-faint);margin-right:3px;letter-spacing:.02em}
.mchip{
  display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:2px;
  border:1px solid transparent;background:transparent;color:var(--text-dim);
  font-size:11.5px;font-family:var(--mono);cursor:pointer;letter-spacing:.02em;
  transition:color .18s var(--ease),border-color .18s var(--ease),background .18s var(--ease);
}
.mchip:hover{background:var(--hover);color:var(--text)}
.mchip.active{color:var(--text);border-color:var(--border);background:var(--card)}
.mchip .n{font-size:10px;color:var(--text-faint)}
.search{
  margin-left:auto;border:1px solid var(--border);background:var(--card);color:var(--text);
  border-radius:4px;padding:5px 10px;font-size:12px;font-family:inherit;min-width:150px;outline:none;
}
.search:focus{border-color:var(--line-strong)}
@media(max-width:640px){.search{margin-left:0;width:100%}}

.grid{display:block;transition:opacity .15s var(--ease),transform .15s var(--ease)}
.grid.grid-out{opacity:0;transform:translateY(5px)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px;align-items:start}
.sec{margin:2px 0 22px}
.sec-h{
  display:flex;align-items:baseline;gap:12px;padding:0 1px 8px;margin-bottom:12px;
  border-bottom:1px solid var(--border);
}
.sec-h .t{font-family:var(--serif);font-size:17px;font-weight:600;letter-spacing:.12em;line-height:1.35}
.sec-h .n{font-size:10.5px;color:var(--text-faint);letter-spacing:.05em;font-variant-numeric:tabular-nums}
.sec-h .sp{flex:1}
.card{
  background:var(--card);border:1px solid var(--border);border-radius:2px;
  padding:12px 14px 10px;display:flex;flex-direction:column;
  transition:border-color .2s var(--ease),box-shadow .2s var(--ease);
}
.card:hover{border-color:var(--line-strong);box-shadow:0 2px 12px rgba(0,0,0,.08)}
.card.idle{background:transparent;border-style:dashed;opacity:.86}
.card-head{display:flex;align-items:baseline;gap:8px;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid var(--border)}
.card.idle .card-head{border-bottom-color:transparent;margin-bottom:6px;padding-bottom:2px}
.card-head .nm{font-family:var(--serif);font-size:15px;font-weight:600;letter-spacing:.06em;line-height:1.4}
.card-head .cnt{font-size:10.5px;color:var(--text-faint);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.role{font-size:9.5px;line-height:1.3;letter-spacing:.03em;color:var(--text-dim);border:1px solid var(--line-strong);border-radius:2px;padding:0 4px;white-space:nowrap;font-family:var(--sans)}
.card-head .acts{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .2s var(--ease)}
.card:hover .card-head .acts{opacity:1}
@media(hover:none){.card-head .acts{opacity:.7}}
.icon-btn{border:none;background:transparent;color:var(--text-faint);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:3px}
.icon-btn:hover{color:var(--text);background:var(--hover)}
.icon-btn.del:hover{color:var(--danger)}

.item{position:relative;display:block;padding:8px 2px 8px 0;border-radius:3px;transition:background .15s var(--ease)}
.item:hover{background:var(--hover)}
.item+.item{border-top:1px dashed var(--border)}
.item .dot{display:none}
.item .top{display:flex;align-items:flex-start;gap:7px}
.item .ttl{flex:1 1 auto;min-width:0;font-size:13px;line-height:1.55;word-break:break-word;letter-spacing:.01em;color:var(--text)}
.item .flags{display:flex;gap:4px;flex:0 0 auto;align-items:center;padding-top:1px}
.item .meta{display:flex;gap:5px 7px;align-items:center;margin-top:4px;flex-wrap:wrap}
.item .dt{font-size:10px;color:var(--text-faint);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.item .note{font-size:10.5px;color:var(--text-faint);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;padding:1px 7px;border-radius:2px;border:1px solid currentColor;opacity:var(--tag-o)}
.item .acts{position:absolute;right:0;top:6px;display:flex;gap:1px;opacity:0;transition:opacity .18s var(--ease);background:var(--hover);padding-left:4px;border-radius:2px}
.item:hover .acts{opacity:1}
@media(hover:none){.item .acts{opacity:.6}}
.hours{
  font-size:10.5px;padding:1px 7px;border-radius:2px;cursor:pointer;
  border:1px solid var(--hbd);color:var(--hfg);background:transparent;
  font-family:inherit;letter-spacing:.02em;line-height:1.5;
  transition:background .18s var(--ease),border-color .18s var(--ease),color .18s var(--ease);
}
.hours.issued{--hfg:hsl(150,34%,36%);--hbd:hsl(150,26%,62%)}
.hours.pending{--hfg:hsl(26,52%,40%);--hbd:hsl(26,44%,64%)}
.hours.none{--hfg:var(--text-faint);--hbd:var(--border)}
@media (prefers-color-scheme: dark){
  .hours.issued{--hfg:hsl(150,38%,64%);--hbd:hsl(150,24%,40%)}
  .hours.pending{--hfg:hsl(34,62%,66%);--hbd:hsl(34,44%,42%)}
}
.hours:hover{background:var(--hover)}
.scope{
  font-size:10.5px;padding:1px 7px;border-radius:2px;cursor:pointer;
  border:1px solid var(--sbd);color:var(--sfg);background:transparent;
  font-family:inherit;letter-spacing:.02em;line-height:1.5;
}
.scope.dept{--sfg:hsl(212,38%,40%);--sbd:hsl(212,28%,66%)}
.scope.college{--sfg:hsl(268,26%,46%);--sbd:hsl(268,22%,70%)}
.scope.school{--sfg:hsl(352,34%,46%);--sbd:hsl(352,26%,70%)}
.scope.none{--sfg:var(--text-faint);--sbd:var(--border)}
@media (prefers-color-scheme: dark){
  .scope.dept{--sfg:hsl(210,48%,70%);--sbd:hsl(210,26%,44%)}
  .scope.college{--sfg:hsl(268,42%,74%);--sbd:hsl(268,22%,46%)}
  .scope.school{--sfg:hsl(352,52%,74%);--sbd:hsl(352,26%,46%)}
}
.scope:hover{background:var(--hover)}
.shot{
  font-size:10.5px;padding:1px 7px;border-radius:2px;cursor:pointer;
  border:1px solid var(--sbd);color:var(--sfg);background:transparent;
  font-family:inherit;letter-spacing:.02em;line-height:1.5;
}
.shot.used{--sfg:hsl(150,34%,36%);--sbd:hsl(150,26%,62%)}
.shot.spare{--sfg:hsl(42,40%,38%);--sbd:hsl(42,32%,64%)}
.shot.redo{--sfg:hsl(8,44%,44%);--sbd:hsl(8,34%,66%)}
.shot.none{--sfg:var(--text-faint);--sbd:var(--border)}
@media (prefers-color-scheme: dark){
  .shot.used{--sfg:hsl(150,38%,64%);--sbd:hsl(150,24%,40%)}
  .shot.spare{--sfg:hsl(42,56%,68%);--sbd:hsl(42,34%,44%)}
  .shot.redo{--sfg:hsl(8,58%,68%);--sbd:hsl(8,32%,44%)}
}
.shot:hover{background:var(--hover)}
.push{
  font-size:10.5px;padding:1px 7px;border-radius:2px;cursor:pointer;
  border:1px solid var(--pbd);color:var(--pfg);background:transparent;
  font-family:inherit;letter-spacing:.02em;line-height:1.5;
}
.push.sent{--pfg:hsl(212,36%,42%);--pbd:hsl(212,26%,66%)}
.push.unsent{--pfg:hsl(8,44%,44%);--pbd:hsl(8,34%,66%)}
.push.none{--pfg:var(--text-faint);--pbd:var(--border)}
@media (prefers-color-scheme: dark){
  .push.sent{--pfg:hsl(212,44%,66%);--pbd:hsl(212,26%,44%)}
  .push.unsent{--pfg:hsl(8,58%,68%);--pbd:hsl(8,32%,44%)}
}
.push:hover{background:var(--hover)}
.dtag{
  font-size:10.5px;padding:1px 7px;border-radius:2px;cursor:pointer;
  border:1px solid var(--dbd);color:var(--dfg);background:transparent;
  font-family:inherit;letter-spacing:.02em;line-height:1.5;
}
.dtag.done{--dfg:hsl(150,34%,36%);--dbd:hsl(150,26%,62%)}
.dtag.todo{--dfg:hsl(8,44%,44%);--dbd:hsl(8,34%,66%)}
.dtag.none{--dfg:var(--text-faint);--dbd:var(--border)}
@media (prefers-color-scheme: dark){
  .dtag.done{--dfg:hsl(150,38%,64%);--dbd:hsl(150,24%,40%)}
  .dtag.todo{--dfg:hsl(8,58%,68%);--dbd:hsl(8,32%,44%)}
}
.dtag:hover{background:var(--hover)}
.mtag{font-size:10.5px;padding:1px 7px;border-radius:2px;border:1px solid hsl(42,32%,64%);color:hsl(42,40%,38%);letter-spacing:.02em;line-height:1.5}
@media (prefers-color-scheme: dark){.mtag{color:hsl(42,56%,68%);border-color:hsl(42,34%,44%)}}
.miniacts{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 9px}
.miniact{display:inline-flex;align-items:baseline;gap:7px;padding:4px 9px;background:var(--card);
  border:1px solid var(--border);border-radius:2px;cursor:pointer;font:inherit;color:var(--text-dim);
  font-size:11px;line-height:1.7;transition:background .12s var(--ease),border-color .12s var(--ease)}
.miniact:hover{background:var(--hover);border-color:var(--line-strong)}
.miniact .ma-d{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.miniact .ma-n{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.miniact .ma-num{font-size:10px;color:var(--text-faint);font-variant-numeric:tabular-nums}
.miniact.sent{box-shadow:inset 2px 0 0 hsl(150,26%,52%)}
.miniact.done{box-shadow:inset 2px 0 0 hsl(210,18%,66%)}
.miniact.todo{box-shadow:inset 2px 0 0 hsla(0,38%,45%,.55)}
@media (prefers-color-scheme: dark){
  .miniact.sent{box-shadow:inset 2px 0 0 hsl(150,34%,48%)}
  .miniact.done{box-shadow:inset 2px 0 0 hsl(210,22%,52%)}
  .miniact.todo{box-shadow:inset 2px 0 0 hsla(0,45%,55%,.5)}
}
.projline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:-2px 0 8px;font-size:10.5px;color:var(--text-faint)}
.ptbl{border:1px solid var(--border);border-radius:2px;background:var(--card);overflow:hidden}
.prow{display:grid;grid-template-columns:104px minmax(0,1fr) 136px 26px;gap:8px;align-items:center;
  padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px}
.prow:last-child{border-bottom:0}
.pn{font-weight:600;display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pt b{display:block;font-weight:500;line-height:1.5}
.pt em{font-style:normal;font-size:10px;color:var(--text-faint)}
.ps{font-size:10.5px;color:var(--text-dim);text-align:right;line-height:1.5}
.prow.pmerge{grid-template-columns:104px minmax(0,1fr);align-items:start}
.ptasks{display:flex;flex-direction:column;gap:4px;min-width:0}
.task{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.tt2{font-weight:500;font-size:12px}
.tmeta{font-size:10px;color:var(--text-faint)}
.tacts{margin-left:auto;display:flex;gap:2px;opacity:.5}
.task:hover .tacts{opacity:1}
@media (max-width:640px){
  .prow{grid-template-columns:88px minmax(0,1fr) 26px}
  .ps{display:none}
  .prow.pmerge{grid-template-columns:88px minmax(0,1fr)}
}
.sec-cap{display:block;font-size:10.5px;color:var(--text-faint);margin:0 0 8px;letter-spacing:.04em}
.act{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:2px;
  padding:9px 12px;margin-bottom:6px;cursor:pointer;font-family:inherit;
  transition:border-color .18s var(--ease),background .18s var(--ease)}
.act:hover{border-color:var(--line-strong);background:var(--hover)}
.act.sent{box-shadow:inset 2px 0 0 hsl(150,26%,52%)}
.act.done{box-shadow:inset 2px 0 0 hsl(210,18%,66%)}
.act.todo{box-shadow:inset 2px 0 0 hsla(0,38%,45%,.55)}

@media (prefers-color-scheme: dark){
  .act.sent{box-shadow:inset 2px 0 0 hsl(150,34%,48%)}
  .act.done{box-shadow:inset 2px 0 0 hsl(210,22%,52%)}
  .act.todo{box-shadow:inset 2px 0 0 hsla(0,45%,55%,.5)}
}
.act-top{display:flex;align-items:baseline;gap:8px}
.act-d{font-family:var(--mono);font-size:10.5px;color:var(--text-faint);flex:0 0 auto}
.act-n{font-size:13.5px;font-weight:600;letter-spacing:.01em;flex:1;min-width:0}
.act-num{font-size:10.5px;color:var(--text-faint);flex:0 0 auto}
.act-sub{font-size:10.5px;color:var(--text-faint);margin-top:3px;line-height:1.6}
.actkind{display:inline-block;font-size:10px;line-height:1.6;padding:0 5px;margin-right:6px;border-radius:2px;
  border:1px solid var(--line-strong);color:var(--text-dim);letter-spacing:.04em;vertical-align:1px}
.actkind.brief{border-color:var(--danger);color:var(--danger);opacity:.9}
.act-sub .bw{color:var(--danger);opacity:.9}
.act-st{font-size:10px;padding:1px 6px;border-radius:2px;border:1px solid currentColor;flex:0 0 auto;letter-spacing:.04em;line-height:1.65;font-weight:500}
.act-st.sent{color:hsl(150,26%,38%)}
.act-st.done{color:hsl(210,18%,46%)}
.act-st.todo{color:var(--danger);opacity:.9}
@media (prefers-color-scheme: dark){

}
@media (max-width:640px){

}

.todaysep .ts-k{font-size:10.5px;color:var(--text);letter-spacing:.1em;flex:0 0 auto}

.todaysep .ts-gap{flex:1;min-width:8px}

  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
@media(max-width:600px){
  .todaysep{flex-wrap:wrap;row-gap:2px}
  .todaysep .ts-gap{display:none}
  .todaysep .ts-n{flex:1 1 100%;text-align:left}
}
.actadd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;
  border:1px dashed var(--border);border-radius:2px;margin:2px 0 10px}
.actadd select,.actadd input{font-family:inherit;font-size:11.5px;padding:4px 6px;
  border:1px solid var(--border);border-radius:2px;background:var(--card);color:var(--text)}

.actadd input:focus,.actadd select:focus{border-color:var(--line-strong);outline:none}
.tblwrap{max-height:46vh;overflow:auto;border:1px solid var(--border);border-radius:2px;margin:4px 0 10px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th,.tbl td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
.tbl th{font-weight:600;font-size:10.5px;color:var(--text-faint);letter-spacing:.06em;background:var(--card);position:sticky;top:0}
.tbl td.tt{color:var(--text-dim);line-height:1.6}
.tbl .dt{display:inline-block;font-size:10px;color:var(--text-faint);margin-top:2px}
.tbl.noshot th:nth-child(3),.tbl.noshot td:nth-child(3){display:none}
.tbl.nopush th:nth-child(5),.tbl.nopush td:nth-child(5){display:none}
.smini{font-family:inherit;font-size:11px;padding:3px 4px;border:1px solid var(--border);border-radius:2px;
  background:var(--card);color:var(--text-dim);cursor:pointer;min-width:64px}
.smini:hover{border-color:var(--line-strong);color:var(--text)}
.mh{font-family:var(--serif);font-size:15px;font-weight:600;margin-bottom:10px;letter-spacing:.01em;display:flex;align-items:flex-start;gap:8px}
.mh-t{flex:1 1 auto;min-width:0}
.mclose{flex:0 0 auto;width:28px;height:28px;border:1px solid var(--border);border-radius:2px;background:transparent;color:var(--text-faint);font-size:15px;line-height:1;cursor:pointer;font-family:var(--sans)}
.mclose:hover{color:var(--text);border-color:var(--line-strong);background:var(--hover)}
.mclose-fixed{display:none}
.row-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.hmenu{
  position:fixed;z-index:90;background:var(--head-bg);border:1px solid var(--line-strong);border-radius:2px;
  padding:3px;display:flex;flex-direction:column;min-width:120px;
  box-shadow:0 10px 28px rgba(0,0,0,.30),0 0 0 1px rgba(0,0,0,.04);
}
.hopt{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  padding:7px 10px;font-size:12px;border:0;border-radius:2px;background:transparent;
  color:var(--text);cursor:pointer;font-family:inherit;text-align:left;white-space:nowrap;
}
.hopt:hover{background:var(--hover)}
.hopt.on{color:var(--text-faint)}
.hopt .tick{font-size:10px;color:var(--text-faint)}
#toast .undo{
  margin-left:8px;padding:0 6px;font-size:11px;border:1px solid currentColor;border-radius:2px;
  background:transparent;color:inherit;cursor:pointer;font-family:inherit;pointer-events:auto;
}
.empty{color:var(--text-faint);font-size:12px;padding:10px 2px}

.idlebar{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  border:1px dashed var(--border);border-radius:2px;background:transparent;
  padding:10px 14px;font-size:12px;color:var(--text-faint);
}
.idlebar .names{color:var(--text-dim)}
.idlebar .sp{margin-left:auto}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex;animation:maskIn .18s var(--ease)}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--card);border:1px solid var(--border);border-radius:2px;
  width:460px;max-width:100%;max-height:86vh;overflow:auto;padding:20px 22px;
  animation:popUp .24s var(--ease);
}
@keyframes popUp{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.modal.wide{width:640px}
.modal.actw{width:880px;max-width:96vw}
.actw .tbl{min-width:780px}
.actw .tbl th,.actw .tbl td{white-space:nowrap}
.actw .tbl td.tt{white-space:normal;min-width:230px}
.actw .smini{min-width:78px}
.modal h2{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.05em;margin-bottom:14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11.5px;color:var(--text-faint);margin-bottom:5px;letter-spacing:.04em}
.field input,.field select,.field textarea{
  width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;
  background:var(--bg);color:var(--text);font-size:13px;font-family:inherit;outline:none;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--line-strong);background:var(--card)}
.field textarea{resize:vertical;min-height:120px;line-height:1.6;font-size:12.5px}
.field .hint{font-size:10.5px;color:var(--text-faint);margin-top:4px;line-height:1.5}
.field .exclude-grid label{display:flex;align-items:center;gap:5px;min-width:0;font-size:12px;color:var(--text-dim);margin-bottom:0;letter-spacing:normal;white-space:normal;line-height:1.35}
.field .exclude-grid input[type="checkbox"]{appearance:auto;width:13px;height:13px;min-width:13px;padding:0;margin:0;border:0;background:transparent;box-shadow:none;flex:0 0 auto}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnk{background:none;border:none;padding:0;font:inherit;font-size:10.5px;color:var(--text);text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.lnk:hover{color:var(--text-faint)}
.donebox{margin-top:12px;padding:10px 12px;border:1px solid var(--border);border-radius:2px;background:var(--head-bg);font-size:11.5px;line-height:1.7}
.modal .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.err{color:var(--danger);font-size:11.5px;min-height:16px;margin-top:4px}
.catlist{display:flex;flex-direction:column;gap:6px}
.catrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg)}
.catrow .mono{font-family:var(--mono);font-size:11px;color:var(--text-faint)}
.catrow .dim{opacity:.7;margin-left:auto}
.catrow .tag{min-width:62px;text-align:center}
.catrow .icon-btn.del{margin-left:auto}
.mrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg)}
.mrow .nm{font-size:12.5px;min-width:88px}
.mrow .mono{font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}
.mrow .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--text-faint)}
.mrow .cnt.zero{color:var(--danger);opacity:.85}
.chg{padding:6px 8px;border:1px solid var(--border);border-radius:3px;background:var(--bg);font-size:11.5px;line-height:1.65}
.chg .meta{font-family:var(--mono);font-size:10px;color:var(--text-faint)}
.chg .what{color:var(--text)}
.chg .obj{color:var(--text-dim)}

/* 桌面端：活动表横向滚动时姓名列不跟着跑，改哪一行不迷路 */
.modal{position:relative}
.actw .tbl th:first-child,.actw .tbl td:first-child{position:sticky;left:0;z-index:2;background:var(--card)}
.actw .tbl th:first-child{z-index:3;background:var(--head-bg)}
body.modal-open{overflow:hidden}

/* 手机端：弹窗铺满、活动表一条一卡、按钮够大好点 */
@media(max-width:760px){
  body{padding:10px 10px calc(10px + env(safe-area-inset-bottom))}
  .topbar{padding:10px 12px;gap:6px;align-items:flex-start}
  .topbar h1{font-size:18px;letter-spacing:.06em;flex:1 1 100%}
  .topbar .sub{font-size:10px}
  .tb-actions{flex:1 1 100%;margin-left:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  .tb-actions .btn{width:100%;padding:6px 4px;min-height:34px;font-size:12px;white-space:nowrap}
  .filters{gap:5px;padding:8px 10px}
  .chip{padding:5px 9px;font-size:11.5px}
  .chip .n{font-size:10px}
  .mchip{font-size:11px;padding:4px 7px}
  .btn{padding:8px 11px;font-size:12px;min-height:36px}
  .btn-sm{padding:6px 9px;font-size:11.5px;min-height:32px}
  /* 16px 是 iOS 不触发聚焦缩放的下限 */
  .search{font-size:16px}
  .field input,.field select,.field textarea{font-size:16px}
  .actadd select,.actadd input{font-size:16px;padding:6px}
  .smini{font-size:16px;padding:5px 6px;min-width:0}
  .sec-h{display:block;padding-bottom:8px}
  .sec-h .t{display:block;font-size:16px;line-height:1.45;letter-spacing:.08em}
  .sec-h .n{display:block;margin-top:3px;white-space:nowrap;font-size:10px}
  .miniacts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .miniact{width:100%;min-width:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 6px;padding:7px 9px;text-align:left}
  .miniact .ma-n{order:1;flex:1 1 100%;min-width:0;max-width:none;white-space:normal;overflow:visible;text-overflow:clip;line-height:1.45}
  .miniact .ma-d{order:2}
  .miniact .act-st{order:3}
  .miniact .ma-num{order:4;margin-left:auto}
  .item .acts{position:static;display:flex;justify-content:flex-end;opacity:1;margin-top:2px;background:transparent;padding-left:0}
  .item{padding-right:0}
  #toast{max-width:calc(100vw - 28px);bottom:calc(20px + env(safe-area-inset-bottom));text-align:center}
  .mask{padding:0;align-items:stretch}
  .modal,.modal.wide,.modal.actw{width:100%;max-width:100%;height:100dvh;min-height:100dvh;max-height:100dvh;border:0;border-radius:0;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom));overflow:auto}
  .modal.actw{padding-top:0}
  .modal.actw .mh{padding:calc(12px + env(safe-area-inset-top)) 0 8px;margin:0 0 8px;position:sticky;top:0;z-index:8;background:var(--card);border-bottom:1px solid var(--border)}
  .modal.actw .mh{padding-right:0}
  .modal.actw .mh-t{padding-right:34px}
  .modal.actw .mh .mclose{display:none}
  .mclose-fixed{display:block;position:fixed;top:calc(8px + env(safe-area-inset-top));right:8px;z-index:130;background:var(--card)}
  /* 表头在手机上隐藏，每行改成一张小卡，四个下拉各占半行，字段名用 data-l 补回来 */
  .actw .tblwrap{max-height:none;border:0;overflow:visible}
  .actw .tbl{min-width:0}
  .actw .tbl tr:first-child{display:none}
  .actw .tbl tr{display:flex;flex-wrap:wrap;gap:7px 10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border)}
  .actw .tbl td{border:0;padding:0;white-space:normal}
  .actw .tbl td:first-child{position:static;flex:1 1 100%;font-weight:600;font-size:12.5px;color:var(--text);background:transparent}
  .actw .tbl td.tt{flex:1 1 100%;min-width:0}
  .actw .tbl td[data-l]{flex:1 1 calc(50% - 6px);display:flex;flex-direction:column;gap:3px;min-width:0;font-size:10.5px}
  .actw .tbl td[data-l]::before{content:attr(data-l);font-size:9.5px;color:var(--text-faint);letter-spacing:.08em}
  .actw .tbl td[data-l] .smini{width:100%}
  .actw .tbl td[data-na="1"]{display:none}
  .actw .tbl td:last-child{flex:0 0 auto;margin-left:auto;align-self:flex-start}
  .actw .row-btns{background:var(--card);padding:10px 0 4px;margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid var(--border)}
  .actw .row-btns .btn{width:100%;white-space:nowrap;border:1px solid var(--border);background:var(--card)}
  .actw .row-btns .btn-primary{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
  .actw .row-btns .btn-danger{color:var(--danger);border-color:var(--danger)}
  .actw .row-btns .btn:last-child{grid-column:1 / -1}
  .actadd{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .actadd select:first-of-type,.actadd input,.actadd .btn{grid-column:1 / -1}
  .actadd input{width:100%;min-width:0}
  .actadd .btn{border:1px solid var(--border);background:var(--card);min-height:36px}
}
@media(max-width:360px){

  .months::-webkit-scrollbar{display:none}
  .months .lbl,.mchip{flex:0 0 auto;white-space:nowrap}
}

  padding:8px 16px;font-size:12.5px;opacity:0;pointer-events:none;

/* ============ 变量（暗/亮双模式） ============ */
:root{
  /* ---- 暖墨暗色（2026-09-13 起，纯黑已退役）---- */
  --bg:#0D0C0A;
  --bg2:#111010;
  --bg3:#1A1916;
  --bg-card:rgba(20,19,16,0.80);
  --primary:#C2BDAD;
  --primary-rgb:194,189,173;
  --t1:#E4E1D6;
  --t2:#CFCBBE;
  --t3:#94907F;
  --t3-rgb:148,144,127;
  --border:#2E2C28;
  --border-strong:#4A473F;
  --translucent:rgba(20,19,16,0.80);
  --shadow:0 4px 12px rgba(0,0,0,0.40);
  --radius:2px;
  --radius-btn:4px;
  --radius-pill:10px;
  --content-w:80ch;
  --header-w:85ch;
  --font-serif:"Spectral","Noto Serif SC","Songti SC","Source Han Serif SC","STSong",serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,monospace;
  --ease:cubic-bezier(0.4,0,0.2,1);
  --dur:0.24s;

  /* ---- 站点主色注入点：各站改这一个变量即可保留自己的色彩个性 ---- */
  --site-accent:#C2BDAD;
  --color-accent:var(--site-accent);

  /* ---- 规范命名别名（--color-* 与短别名同语义）---- */
  --color-bg-primary:var(--bg);
  --color-bg-secondary:var(--bg2);
  --color-bg-tertiary:var(--bg3);
  --color-primary:var(--primary);
  --color-primary-rgb:var(--primary-rgb);
  --color-text-primary:var(--t1);
  --color-text-secondary:var(--t2);
  --color-text-tertiary:var(--t3);
  --color-border:var(--border);
  --color-border-dark:var(--border-strong);
}
@media(prefers-color-scheme:light){
  :root{
    --bg:#FDFDF3;--bg2:#FAFAF0;--bg3:#FAFAF0;
    --bg-card:rgba(245,245,235,0.88);
    --primary:#191702;--primary-rgb:16,12,4;
    --t1:#353035;--t2:#474238;--t3:#999999;--t3-rgb:153,153,153;
    --border:#CBCBBB;--border-strong:#494848;
    --translucent:rgba(245,245,235,0.9);
    --shadow:0 4px 12px rgba(0,0,0,0.08);
  }
  }
}

/* ============ 排版基线 ============ */
body{
  font-family:var(--font-serif);
  font-size:0.95em;
  line-height:1.7;
  color:var(--t1);
  background:var(--bg);
  text-align:left;
  -webkit-font-smoothing:antialiased;
  margin:0;
}
p{margin:0 0 1em;line-height:1.7}

/* ============ 标题层级（em 阶梯，h1=1.8，h2=1.35） ============ */
body h1,body h2,body h3,body h4,body h5,body h6{
  font-family:var(--font-serif);
  font-weight:700;
  color:var(--t1);
  line-height:1.25;
  letter-spacing:0.005em;
  margin:1.4em 0 0.4em;
}
body h1{font-size:1.8em;line-height:1.2;margin-top:0.2em;letter-spacing:0.003em}
body h2{font-size:1.35em;margin-top:1.6em;line-height:1.25}
body h3{font-size:1.1em;margin-top:1.3em;line-height:1.3}
body h4{font-size:0.95em;margin-top:1.2em;line-height:1.4;font-weight:600;color:var(--t2)}
body h5{font-size:0.85em;margin-top:1em;line-height:1.45;font-weight:600;color:var(--t2)}
body h6{font-size:0.75em;margin-top:0.8em;line-height:1.5;color:var(--t3);text-transform:uppercase;letter-spacing:0.12em;font-weight:600}
/* h1 第一行距收紧：避免页面顶部太空 */
body h1:first-child{margin-top:0}
@media(max-width:768px){
  body h1{font-size:1.5em}
  body h2{font-size:1.2em}
  body h3{font-size:1.05em}
}

/* ============ Header 统一规范（浮动毛玻璃） ============ */
.ink-head{
  position:fixed;top:12px;left:50%;
  transform:translateX(-50%);
  z-index:9999;
  /* 宽度：87ch（和 content 等宽，成组而非"中间突出"），下限 55vw（手机不超视口） */
  width:clamp(55vw, 87ch, 100%);
  max-width:calc(100% - 24px);
  background:var(--bg-card);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(var(--primary-rgb),0.12);
  border-radius:var(--radius);
  box-shadow:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 0 0 1px rgba(255,255,255,0.02),
    var(--shadow);
  padding:0.7rem 1.2rem;
  font-family:var(--font-serif);
  transition:
    transform 0.3s cubic-bezier(0.16,1,0.3,1),
    box-shadow 0.4s cubic-bezier(0.34,1.56,0.64,1),
    border-color 0.3s ease;
}
/* header 滚动隐藏 */
.ink-head.ink-head--hidden{transform:translateX(-50%) translateY(calc(-100% - 12px))}
.ink-head:hover{transform:translateX(-50%) translateY(-2px);border-color:rgba(var(--primary-rgb),0.3)}
.ink-head:hover.ink-head--hidden{transform:translateX(-50%) translateY(calc(-100% - 12px))}
/* header 内部布局：h1 在左，sub 跟 h1 同行，nav 单独一行居中 */
.ink-head h1{
  margin:0;font-size:1.05em;font-weight:700;display:inline-block;
  vertical-align:middle;margin-right:0.6em;
}
.ink-head h1 a{color:var(--t1);text-decoration:none;transition:color 0.2s}
.ink-head h1 a:hover{color:var(--primary)}
.ink-head .sub{
  display:inline-block;font-size:0.75em;color:var(--t3);
  vertical-align:middle;letter-spacing:0.03em;font-weight:400;
}
.ink-head nav{
  display:flex;flex-wrap:wrap;gap:0.3rem;
  margin-top:0.5rem;font-size:0.78em;
}
.ink-head nav a{
  padding:0.2em 0.7em;color:var(--t2);
  border:1px solid rgba(var(--primary-rgb),0.1);
  border-radius:var(--radius);
  text-decoration:none;
  transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1);
}
.ink-head nav a:hover{
  color:var(--bg);background:var(--primary);
  border-color:var(--primary);transform:translateY(-1px);
}
@media(max-width:768px){
  .ink-head{padding:0.5rem 0.8rem;top:8px}
  .ink-head h1{font-size:0.95em;display:block;margin:0 0 0.2rem 0}
  .ink-head .sub{display:block;font-size:0.7em;margin-bottom:0.2rem}
  .ink-head nav{font-size:0.7em;gap:0.25rem}
  .ink-head nav a{padding:0.15em 0.45em}
}
@media(hover:none){
  .ink-head:hover{transform:translateX(-50%) translateY(0)}
  .ink-head:hover.ink-head--hidden{transform:translateX(-50%) translateY(calc(-100% - 12px))}
  .ink-head nav a:hover{transform:none}
}

/* ============ Container ============ */
.ink-container{
  /* 宽度：87ch（比 header 窄 3ch），下限 55vw（小屏自适应） */
  width:clamp(55vw, 87ch, 100%);
  margin:0 auto;
  padding:0 1.5rem;
}
@media(max-width:768px){
  .ink-container{padding:0 1rem;width:100%}
}

/* hero 区域让位 fixed header（header 高度约 80px，padding-top: 130px 让 header 下方 50px 呼吸） */
.hero{padding-top:130px;padding-bottom:0.5em}
@media(max-width:768px){.hero{padding-top:110px}}

/* section 段落容器（统一限宽 87ch） */
.ink-section,.ink-container.section{
  width:clamp(55vw, 87ch, 100%);
  margin:0 auto;
  padding:0 1.5rem;
}

/* ============ Hero 区域统一规范 ============ */
/* kicker: 英文小标（uppercase，字距大） */
.kicker{
  display:block;
  font-size:0.78em;
  letter-spacing:0.25em;
  color:var(--t3);
  text-transform:uppercase;
  margin:0 0 1.2em;
  font-weight:500;
}
.kicker:first-child{margin-top:0}
/* subtitle: 主标题下的描述 */
.subtitle{
  display:block;
  font-size:1em;
  line-height:1.7;
  color:var(--t2);
  margin:0.8em 0;
  max-width:none;
}
.subtitle b{color:var(--t1);font-weight:600}
/* meta: 数据来源（小灰字） */
.meta{
  display:block;
  font-size:0.78em;
  color:var(--t3);
  letter-spacing:0.02em;
  margin:1em 0 0;
  opacity:0.85;
}

/* ============ Footer 统一规范（毛玻璃卡 + 砖红强调） ============ */
.ink-foot{
  margin-top:80px;
  padding:0 1.5rem 32px;
}
.ink-foot-inner{
  width:clamp(55vw, 87ch, 100%);
  margin:0 auto;
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px 24px;
  align-items:center;
  padding:18px 24px;
  background:var(--bg-card);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid var(--color-border);
  border-radius:2px;
  box-shadow:var(--shadow);
  font-family:var(--font-serif);
}
.ink-foot .ft-row{
  font-size:0.78em;
  color:var(--t2);
  letter-spacing:0.02em;line-height:1.5;
  margin:0;
  grid-column:1;
}
.ink-foot .ft-row b{color:var(--t1);font-weight:600}
.ink-foot .ft-mute{color:var(--t3);font-size:0.95em}
.ink-foot .ft-top{
  grid-column:2;
  grid-row:1 / span 3;
  color:var(--t3);
  font-size:0.72em;
  text-decoration:none;
  letter-spacing:0.1em;
  border-left:1px solid var(--color-border);
  padding-left:24px;
  transition:color 0.2s;
  white-space:nowrap;
  font-weight:500;
}
.ink-foot .ft-top:hover{color:var(--t1);border-left-color:var(--color-accent, #c64f44)}
.ink-foot a{color:var(--t2);text-decoration:none;border-bottom:1px solid transparent;transition:all 0.2s}
.ink-foot a:hover{color:var(--t1);border-bottom-color:var(--t1)}

/* Footer 强调色（如果定义了 --color-accent 就用，否则用砖红 #c64f44） */
:root{--color-accent:#c64f44}

/* ============ 回顶按钮 ============ */
.ink-back-top{
  position:fixed;right:1.5rem;bottom:1.5rem;
  width:2.6rem;height:2.6rem;
  background:var(--bg-card);
  backdrop-filter:blur(7px);
  border:1px solid rgba(var(--primary-rgb),0.15);
  border-radius:var(--radius);
  color:var(--t1);
  font-size:1.1em;cursor:pointer;
  opacity:0;transform:translateY(8px);pointer-events:none;
  transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  z-index:9998;font-family:inherit;
}
.ink-back-top.show{opacity:1;transform:translateY(0);pointer-events:auto}
.ink-back-top:hover{color:var(--primary);border-color:rgba(var(--primary-rgb),0.4);transform:translateY(-2px)}
@media(pointer:coarse){.ink-back-top{width:2.4rem;height:2.4rem;right:1rem;bottom:1rem}}

/* ============ 图片灯箱 ============ */
.ink-lb{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:10000;cursor:pointer}
.ink-lb.show{display:flex;animation:ink-fade-in 0.25s ease}
@keyframes ink-fade-in{from{opacity:0}to{opacity:1}}
.ink-lb img{max-width:92vw;max-height:92vh;border-radius:var(--radius);border:1px solid rgba(var(--primary-rgb),0.2);box-shadow:var(--shadow)}
.ink-lb-close{position:absolute;top:1rem;right:1.5rem;background:transparent;border:none;color:var(--t1);font-size:2em;cursor:pointer;line-height:1;width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;border-radius:var(--radius);transition:all 0.2s}
.ink-lb-close:hover{color:var(--primary);background:rgba(var(--primary-rgb),0.08)}

/* ============ v6 扩展 token（向后兼容，老变量全部保留） ============ */
:root{
  --ink-accent-soft:rgba(198,79,68,.10);
  --ink-ok:#4c8b6b;--ink-warn:#b0812f;--ink-danger:#c4544a;--ink-info:#4a7fae;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:24px;--sp-6:32px;--sp-7:48px;
  --fs-xs:.75em;--fs-sm:.82em;--fs-md:.95em;--fs-lg:1.1em;--fs-xl:1.35em;
  --radius-sm:2px;--radius-md:6px;--radius-lg:10px;
  --ring:0 0 0 2px rgba(var(--primary-rgb),.26);
  --ease:cubic-bezier(.34,1.56,.64,1);
  --dur:.25s;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
@media(prefers-color-scheme:light){
  :root{
    --ink-accent-soft:rgba(198,79,68,.08);
    --ink-ok:#2f6a4a;--ink-warn:#8a5c1d;--ink-danger:#9c2f27;--ink-info:#2f5a83;
  }
}


/* ================================================================
   INKFLAKE UI v6 —— 组件层
   依赖 ink-base.css 的 token，全部组件跟随暗/亮模式自动切换
   用法：<link rel="stylesheet" href="/v6/ink.css">
   约定：类名一律 ink- 前缀，2px 圆角，衬线字体，克制配色
   ================================================================ */

/* ============ 图标基类（配合 icons.svg 使用） ============ */
.ink-ico{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em;
  vertical-align:-0.12em;flex:0 0 auto}
.ink-ico svg{width:100%;height:100%;display:block;
  fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ink-ico.lg{width:1.25em;height:1.25em}
.ink-ico.sm{width:.85em;height:.85em}

/* ============ 卡片 ============ */
.ink-card{
  border:1px solid var(--border);border-radius:var(--radius);
  background:var(--bg-card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);overflow:hidden;
}
.ink-card--flat{background:var(--bg2);backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.ink-card--accent{border-left:2px solid var(--color-accent)}
.ink-card-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-5);border-bottom:1px solid var(--border);
}
.ink-card-head h3,.ink-card-head h4{margin:0;font-size:var(--fs-lg);line-height:1.3}
.ink-card-head .ink-sub{font-size:var(--fs-xs);color:var(--t3);letter-spacing:.06em}
.ink-card-body{padding:var(--sp-5)}
.ink-card-body--tight{padding:var(--sp-3) var(--sp-4)}
.ink-card-foot{
  padding:var(--sp-3) var(--sp-5);border-top:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  font-size:var(--fs-sm);color:var(--t3);background:var(--bg3);
}
.ink-card-hover{transition:transform var(--dur) var(--ease),border-color var(--dur) ease,box-shadow var(--dur) ease}
.ink-card-hover:hover{transform:translateY(-2px);border-color:var(--border-strong)}

/* ============ 按钮 ============ */
.ink-btn{
  display:inline-flex;align-items:center;gap:.45em;
  font-family:inherit;font-size:var(--fs-sm);line-height:1;
  padding:.62em 1.05em;border-radius:var(--radius);
  border:1px solid var(--border-strong);background:var(--bg2);color:var(--t1);
  cursor:pointer;text-decoration:none;white-space:nowrap;
  transition:background var(--dur) ease,color var(--dur) ease,border-color var(--dur) ease,transform var(--dur) var(--ease);
}
.ink-btn:hover{background:var(--bg3);border-color:var(--t3);transform:translateY(-1px)}
.ink-btn:active{transform:translateY(0)}
.ink-btn:focus-visible{outline:none;box-shadow:var(--ring)}
.ink-btn[disabled],.ink-btn.is-disabled{opacity:.45;pointer-events:none}
.ink-btn--primary{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.ink-btn--primary:hover{background:var(--t1);border-color:var(--t1);color:var(--bg)}
.ink-btn--ghost{background:transparent;border-color:var(--border)}
.ink-btn--ghost:hover{background:var(--bg3);border-color:var(--border-strong)}
.ink-btn--danger{border-color:var(--ink-danger);color:var(--ink-danger)}
.ink-btn--danger:hover{background:var(--ink-danger);color:var(--bg);border-color:var(--ink-danger)}
.ink-btn--quiet{border-color:transparent;background:transparent;color:var(--t2);padding:.45em .7em}
.ink-btn--quiet:hover{color:var(--t1);background:var(--bg3)}
.ink-btn--sm{font-size:var(--fs-xs);padding:.45em .8em}
.ink-btn--lg{font-size:var(--fs-md);padding:.75em 1.3em}
.ink-btn--block{display:flex;width:100%;justify-content:center}
.ink-btn-row{display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center}

/* ============ 徽章 / 标签 ============ */
.ink-badge{
  display:inline-flex;align-items:center;gap:.35em;
  font-size:var(--fs-xs);line-height:1;letter-spacing:.06em;
  padding:.4em .65em;border-radius:var(--radius);
  border:1px solid var(--border-strong);color:var(--t2);background:transparent;
}
.ink-badge--accent{border-color:var(--color-accent);color:var(--color-accent);background:var(--ink-accent-soft)}
.ink-badge--ok{border-color:var(--ink-ok);color:var(--ink-ok)}
.ink-badge--warn{border-color:var(--ink-warn);color:var(--ink-warn)}
.ink-badge--danger{border-color:var(--ink-danger);color:var(--ink-danger)}
.ink-badge--solid{background:var(--primary);color:var(--bg);border-color:var(--primary)}
.ink-chips{display:flex;flex-wrap:wrap;gap:.4em}
.ink-chip{
  font-size:var(--fs-xs);padding:.35em .7em;border-radius:999px;
  border:1px solid var(--border);color:var(--t2);background:var(--bg2);
  cursor:pointer;transition:all var(--dur) ease;font-family:inherit;
}
.ink-chip:hover{border-color:var(--border-strong);color:var(--t1)}
.ink-chip.is-on{background:var(--primary);color:var(--bg);border-color:var(--primary)}

/* ============ 提示条 ============ */
.ink-note{
  display:flex;gap:var(--sp-3);align-items:flex-start;
  padding:var(--sp-3) var(--sp-4);border-radius:var(--radius);
  border:1px solid var(--border);border-left-width:2px;
  background:var(--bg2);font-size:var(--fs-sm);line-height:1.75;color:var(--t2);
}
.ink-note b{color:var(--t1)}
.ink-note--info{border-left-color:var(--ink-info)}
.ink-note--ok{border-left-color:var(--ink-ok)}
.ink-note--warn{border-left-color:var(--ink-warn)}
.ink-note--danger{border-left-color:var(--ink-danger)}
.ink-note .ink-ico{font-size:1.05em;margin-top:.1em}

/* ============ 表格 ============ */
.ink-table{width:100%;border-collapse:collapse;font-size:var(--fs-sm);overflow:hidden}
.ink-table caption{caption-side:top;text-align:left;font-size:var(--fs-xs);color:var(--t3);padding-bottom:.6em;letter-spacing:.06em}
.ink-table th,.ink-table td{text-align:left;padding:.62em .9em;border-bottom:1px solid var(--border);vertical-align:top}
.ink-table th{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--t3);font-weight:600;background:var(--bg3);white-space:nowrap}
.ink-table td{color:var(--t2)}
.ink-table td b,.ink-table td strong{color:var(--t1)}
.ink-table tbody tr:hover td{background:var(--bg3)}
.ink-table--zebra tbody tr:nth-child(even) td{background:var(--bg2)}
.ink-table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--bg-card)}
.ink-table--plain th,.ink-table--plain td{border-bottom-color:var(--border)}
.ink-num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:.94em}

/* ============ 选项卡 ============ */
.ink-tabs{display:flex;flex-wrap:wrap;gap:2px;border-bottom:1px solid var(--border);margin-bottom:var(--sp-4)}
.ink-tab{
  font-family:inherit;font-size:var(--fs-sm);color:var(--t3);background:transparent;
  border:0;border-bottom:2px solid transparent;padding:.6em 1em;cursor:pointer;
  transition:color var(--dur) ease,border-color var(--dur) ease;
}
.ink-tab:hover{color:var(--t1)}
.ink-tab.is-on{color:var(--t1);border-bottom-color:var(--color-accent);font-weight:600}
.ink-tabpanel{display:none}
.ink-tabpanel.is-on{display:block;animation:ink-rise .28s ease both}
@keyframes ink-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ============ 表单 ============ */
.ink-field{display:flex;flex-direction:column;gap:.35em;margin-bottom:var(--sp-3)}
.ink-label{font-size:var(--fs-xs);letter-spacing:.06em;color:var(--t3)}
.ink-hint{font-size:var(--fs-xs);color:var(--t3);line-height:1.6}
.ink-input,.ink-select,.ink-textarea{
  font-family:inherit;font-size:var(--fs-sm);color:var(--t1);
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:.58em .75em;width:100%;box-sizing:border-box;
  transition:border-color var(--dur) ease,box-shadow var(--dur) ease;
}
.ink-input:focus,.ink-select:focus,.ink-textarea:focus{
  outline:none;border-color:var(--border-strong);box-shadow:var(--ring)}
.ink-input::placeholder,.ink-textarea::placeholder{color:var(--t3);opacity:.8}
.ink-textarea{min-height:6.5em;resize:vertical;line-height:1.7}
.ink-select{appearance:none;background-image:none;cursor:pointer}
.ink-switch{display:inline-flex;align-items:center;gap:.55em;cursor:pointer;font-size:var(--fs-sm);color:var(--t2)}
.ink-switch input{position:absolute;opacity:0;pointer-events:none}
.ink-switch .track{
  width:2.35em;height:1.25em;border-radius:999px;border:1px solid var(--border-strong);
  background:var(--bg3);position:relative;transition:background var(--dur) ease,border-color var(--dur) ease;flex:0 0 auto;
}
.ink-switch .track::after{
  content:"";position:absolute;top:1px;left:1px;width:calc(1.25em - 4px);height:calc(1.25em - 4px);
  border-radius:999px;background:var(--t3);transition:transform var(--dur) var(--ease),background var(--dur) ease;
}
.ink-switch input:checked + .track{background:var(--primary);border-color:var(--primary)}
.ink-switch input:checked + .track::after{transform:translateX(1.08em);background:var(--bg)}
.ink-switch input:focus-visible + .track{box-shadow:var(--ring)}

/* ============ 列表 ============ */
.ink-list{list-style:none;margin:0;padding:0;border-top:1px solid var(--border)}
.ink-list li{
  display:flex;align-items:baseline;gap:var(--sp-3);
  padding:.7em 0;border-bottom:1px solid var(--border);font-size:var(--fs-sm);color:var(--t2);
}
.ink-list li b{color:var(--t1);font-weight:600}
.ink-list .tail{margin-left:auto;color:var(--t3);font-size:var(--fs-xs);white-space:nowrap}
.ink-list--plain li{display:block;padding:.35em 0}

/* ============ 代码 / 键盘 ============ */
.ink-code{
  font-family:var(--mono);font-size:var(--fs-sm);line-height:1.7;color:var(--t1);
  background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);
  padding:var(--sp-3) var(--sp-4);overflow-x:auto;white-space:pre;
}
.ink-kbd{
  font-family:var(--mono);font-size:.78em;padding:.15em .45em;border-radius:2px;
  border:1px solid var(--border-strong);border-bottom-width:2px;background:var(--bg3);color:var(--t2);
}

/* ============ 分隔线 / 引用 ============ */
.ink-divider{border:0;border-top:1px solid var(--border);margin:var(--sp-5) 0}
.ink-divider--accent{border-top-color:var(--color-accent);border-top-width:2px}
.ink-quote{
  margin:var(--sp-4) 0;padding:var(--sp-2) var(--sp-5);
  border-left:2px solid var(--color-accent);color:var(--t2);font-size:var(--fs-md);line-height:1.85;font-style:italic;
}
.ink-quote cite{display:block;margin-top:.6em;font-size:var(--fs-xs);color:var(--t3);font-style:normal;letter-spacing:.05em}

/* ============ 进度 / 骨架 / 空态 ============ */
.ink-progress{height:.55em;border-radius:999px;background:var(--bg3);border:1px solid var(--border);overflow:hidden}
.ink-progress > i{display:block;height:100%;background:var(--primary);width:0;transition:width .4s ease}
.ink-progress--accent > i{background:var(--color-accent)}
.ink-skeleton{
  background:linear-gradient(90deg,var(--bg3) 25%,var(--bg2) 37%,var(--bg3) 63%);
  background-size:400% 100%;animation:ink-shimmer 1.3s ease infinite;border-radius:var(--radius);
}
@keyframes ink-shimmer{from{background-position:100% 0}to{background-position:0 0}}
.ink-empty{
  text-align:center;padding:var(--sp-6) var(--sp-4);color:var(--t3);
  border:1px dashed var(--border);border-radius:var(--radius);font-size:var(--fs-sm);line-height:1.8;
}
.ink-empty .ink-ico{font-size:1.8em;display:block;margin:0 auto .5em;opacity:.6}

/* ============ 头像 / 工具条 ============ */
.ink-avatar{
  width:2.2em;height:2.2em;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  font-size:var(--fs-sm);background:var(--bg3);border:1px solid var(--border-strong);color:var(--t1);overflow:hidden;
}
.ink-avatar img{width:100%;height:100%;object-fit:cover}
.ink-toolbar{
  display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  padding:var(--sp-2) var(--sp-3);border:1px solid var(--border);border-radius:var(--radius);background:var(--bg3);
}
.ink-toolbar .spacer{margin-left:auto}

/* ============ 网格 ============ */
.ink-grid{display:grid;gap:var(--sp-4)}
.ink-grid--2{grid-template-columns:repeat(2,minmax(0,1fr))}
.ink-grid--3{grid-template-columns:repeat(3,minmax(0,1fr))}
.ink-grid--4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:860px){.ink-grid--3,.ink-grid--4{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ================================================================
   INKFLAKE 兼容层 v6 · 作用域版 —— ink-compat.css
   ---------------------------------------------------------------
   为什么是作用域：老站点的 --bg / --ink / --line 全局变量不能动，
   否则暗色站（账本）会被兼容层改成米白。所以只在加了 .ink-scope
   的容器内部重定义 v6 token，外面一律不碰。

   用法：
     <link rel="stylesheet" href="/v6/ink.css">
     <link rel="stylesheet" href="/v6/ink-compat.css">
     <div class="ink-scope">      ← 浅底页面（学习中心、物价、图鉴集）
     <div class="ink-scope ink-dark">  ← 暗底页面（账本、86 面板）
   之后容器里就能直接写 .ink-card / .ink-btn / .ink-badge 等组件，
   它们会自动取当前页面自己的配色，不会打架。
   ================================================================ */

/* —— 浅底作用域：取 --paper/--ink 体系；没有就退回 v6 默认 —— */
.ink-scope{
  --bg:        var(--paper,   #f7f4ed);
  --bg2:       var(--paper-2, #fffdf8);
  --bg3:       var(--paper-3, #fbf7ec);
  --bg-card:   var(--paper-2, rgba(255,253,248,.88));
  --translucent: var(--paper-2, rgba(255,253,248,.9));

  --t1: var(--ink,   #1b1a17);
  --t2: var(--ink-2, #443f38);
  --t3: var(--ink-3, #7d786e);

  --border:        var(--line,   #ddd6c8);
  --border-strong: var(--line-2, #c9c0ac);
  --color-accent:  var(--accent, #c64f44);
  --ink-accent-soft: color-mix(in srgb, var(--accent, #c64f44) 10%, transparent);
  --primary: var(--accent, #c64f44);
  --shadow: 0 4px 12px rgba(0,0,0,.08);
}

/* —— 暗底作用域：取账本/面板的 --surface 体系 —— */
.ink-scope.ink-dark{
  --bg:        var(--surface,   #1b1915);
  --bg2:       var(--surface-2, #211e19);
  --bg3:       var(--surface-2, #211e19);
  --bg-card:   var(--surface,   #1b1915);
  --translucent: var(--surface, rgba(27,25,21,.92));

  --t1: var(--ink,   #f1ebdd);
  --t2: var(--ink-2, #c9c1b2);
  --t3: var(--muted, #91897a);

  --border:        var(--line,        rgba(241,235,221,.11));
  --border-strong: var(--line-strong, rgba(241,235,221,.22));
  --color-accent:  var(--accent, #d97757);
  --ink-accent-soft: color-mix(in srgb, var(--accent, #d97757) 12%, transparent);
  --primary: var(--accent, #d97757);
  --shadow: var(--shadow, 0 18px 46px rgba(0,0,0,.28));
}

/* —— 与配色无关的基础统一：焦点环、选中色、滚动条 ——
   这几条在全局生效也不会改变任何布局，只是让各站点手感一致。 */
:focus-visible{
  outline: 2px solid var(--color-accent, #c64f44);
  outline-offset: 2px;
}
::selection{
  background: color-mix(in srgb, var(--color-accent, #c64f44) 22%, transparent);
}
* {
  scrollbar-width: thin;
  scrollbar-color: color-mix(in srgb, var(--t1, #1b1a17) 26%, transparent) transparent;
}
::-webkit-scrollbar{ width: 10px; height: 10px; }
::-webkit-scrollbar-thumb{
  background: color-mix(in srgb, var(--t1, #1b1a17) 24%, transparent);
  border-radius: 6px;
  border: 2px solid transparent;
  background-clip: content-box;
}
::-webkit-scrollbar-thumb:hover{
  background: color-mix(in srgb, var(--t1, #1b1a17) 40%, transparent);
  background-clip: content-box;
}

/* ============================================================
   INKFLAKE v6 主题层 —— theme.css
   一句话：设计语言统一，色彩个性保留。

   统一的是字体、圆角、过渡曲线、卡片质感、限宽节奏；
   各站保留自己的主色 --accent，只通过 --site-accent 注入给 v6 组件。

   加载顺序：ink.css → ink-compat.css → theme.css
   用法：给 <html> 加 data-ink-site（任意值即可）
   ============================================================ */

/* —— 一、站点主色自动继承 ——
   站点自己的 --accent 有值就用它，没有才退回 v6 暖亮灰。
   想换主色，只改站点 CSS 里那一个 --accent，v6 组件自动跟随。 */
[data-ink-site]{
  --site-accent: var(--accent, #C2BDAD);
  --color-accent: var(--site-accent);
}

/* —— 二、字体（规范第 4 条：正文标题衬线，元信息等宽）—— */
[data-ink-site] body,
[data-ink-site] button,
[data-ink-site] input,
[data-ink-site] select,
[data-ink-site] textarea{
  font-family: var(--font-serif, "Spectral","Noto Serif SC","Songti SC","Source Han Serif SC",serif);
}
[data-ink-site] code,
[data-ink-site] pre,
[data-ink-site] kbd,
[data-ink-site] .ink-kbd,
[data-ink-site] .ink-mono,
[data-ink-site] .mono{
  font-family: var(--mono, "JetBrains Mono","SF Mono",Menlo,monospace);
}

/* —— 三、圆角（规范第 5 条：整体偏直角）—— */
[data-ink-site] .ink-card,
[data-ink-site] .ink-note,
[data-ink-site] .ink-table,
[data-ink-site] .ink-input,
[data-ink-site] .ink-select,
[data-ink-site] .ink-textarea{
  border-radius: var(--radius, 2px);
}
[data-ink-site] .ink-btn{
  border-radius: var(--radius-btn, 4px);
}
[data-ink-site] .ink-badge,
[data-ink-site] .ink-chip{
  border-radius: var(--radius-pill, 10px);
}

/* —— 四、过渡（规范第 8 条：0.2~0.3s，统一曲线，不用弹跳）—— */
[data-ink-site] a,
[data-ink-site] button,
[data-ink-site] .ink-card,
[data-ink-site] .ink-btn,
[data-ink-site] .ink-chip,
[data-ink-site] .ink-tab{
  transition:
    background-color var(--dur, .24s) var(--ease, cubic-bezier(.4,0,.2,1)),
    color            var(--dur, .24s) var(--ease, cubic-bezier(.4,0,.2,1)),
    border-color     var(--dur, .24s) var(--ease, cubic-bezier(.4,0,.2,1)),
    transform        var(--dur, .24s) var(--ease, cubic-bezier(.4,0,.2,1));
}

/* —— 五、卡片质感（规范第 7 条：毛玻璃 + 1px 边框 + hover 上浮 2px）—— */
[data-ink-site] .ink-card{
  background: var(--translucent, var(--bg-card));
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
  border: 1px solid var(--border);
}
[data-ink-site] .ink-card:hover{
  transform: translateY(-2px);
  border-color: color-mix(in srgb, var(--primary) 50%, transparent);
}

/* —— 六、图片（规范第 7 条：2px 圆角，头像不用圆）—— */
[data-ink-site] .ink-card img{ border-radius: 2px; }

/* —— 七、限宽节奏（规范第 8 条：1100px / 左右 24px / 手机 16px）—— */
[data-ink-site] .ink-container{
  max-width: 1100px;
  margin-left: auto;
  margin-right: auto;
  padding-left: 24px;
  padding-right: 24px;
}
@media (max-width: 640px){
  [data-ink-site] .ink-container{ padding-left: 16px; padding-right: 16px; }
}

(function(){
  var realFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function(input, init){
    init = init || {};
    var url = typeof input === 'string' ? input : (input && input.url) || '';
    var method = String(init.method || 'GET').toUpperCase();
    if (url.indexOf('/api/overview') !== -1 && method === 'GET') {
      return Promise.resolve(new Response(JSON.stringify(window.__NEWS_DATA__), {
        status: 200, headers: {'Content-Type': 'application/json'}
      }));
    }
    if (url.indexOf('/api/') !== -1 && method !== 'GET') {
      return Promise.resolve(new Response(JSON.stringify({ok:false,error:'公网只读版，不能修改'}), {
        status: 403, headers: {'Content-Type': 'application/json'}
      }));
    }
    if (url.indexOf('/api/') !== -1) {
      return Promise.resolve(new Response(JSON.stringify({ok:false,error:'公网只读版，不能读取该接口'}), {
        status: 403, headers: {'Content-Type': 'application/json'}
      }));
    }
    return realFetch ? realFetch(input, init) : Promise.reject(new Error('fetch unavailable'));
  };
})();

<script>

let savedView = null;

  state.total = !!savedView.total;

}
